<style>

</style>

<script>
/* ===== Config / conexión Supabase (mismo origen) ===== */
const SB_KEY='sb_publishable_huiF1peEje29Scta3_37Vg_fUND8xth';
const SB_BASE=(location.origin.indexOf('supabase.co')>=0)?'':'https://acntkpvyffjvsgvwypps.supabase.co';
const EMAIL_DOMAIN='@mantos.app';
let TOKEN=null;
function authHeaders(){return {apikey:SB_KEY,Authorization:'Bearer '+(TOKEN||SB_KEY),'content-type':'application/json'};}
async function rest(path,method,body,prefer){const h=authHeaders();if(prefer)h.Prefer=prefer;
  const r=await fetch(SB_BASE+'/rest/v1/'+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}throw new Error(method+' '+path+' -> '+r.status+' '+t.slice(0,140));}
  if(method==='GET'||!method)return r.json();const txt=await r.text();return txt?JSON.parse(txt):null;}
async function rpc(fn,args){return rest('rpc/'+fn,'POST',args||{});}

/* ===== Iconos ===== */
const ICONS={dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',mina:'<path d="M3 21h18"/><path d="M3 21L11 7l3 5 2-3 5 12"/><path d="M14 4l5 3"/>',planta:'<path d="M3 21V11l5 3V11l5 3V8l5 3V21z"/><path d="M2 21h20"/>',budget:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>',informes:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',proyeccion:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',usuarios:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.2a3 3 0 0 1 0 5.6"/>',config:'<path d="M4 21v-6M4 11V3M12 21v-8M12 9V3M20 21v-4M20 13V3"/><path d="M2 15h4M10 9h4M18 17h4"/>',trash:'<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',power:'<path d="M12 2v9"/><path d="M18 6a9 9 0 1 1-12 0"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',plus:'<path d="M12 5v14M5 12h14"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 5l4 4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',mountain:'<path d="M3 20h18L13 6l-3 5-2-2z"/>',doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',key:'<circle cx="7.5" cy="15.5" r="3.5"/><path d="M10 13 20 3"/><path d="M15 8l3 3M13 10l2 2"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'};
function ic(n,s){s=s||18;return '<svg class="ico" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
const LOGO='<svg viewBox="0 0 330 92" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto"><defs><linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaa063"/><stop offset="1" stop-color="#9c5b27"/></linearGradient></defs><path d="M66 8 L26 8 L4 46 L26 84 L66 84 L44 46 Z" fill="url(#cu)"/><rect x="84" y="22" width="3" height="48" fill="#b87333"/><text x="102" y="44" fill="#f4f7fa" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="30" letter-spacing="2">CAPSTONE</text><text x="102" y="76" fill="#cf7d3e" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="25" letter-spacing="6">COPPER</text></svg>';

const MODULES={dashboard:{name:'Dashboard General'},mina:{name:'Costos Mina'},planta:{name:'Costos Planta'},budget:{name:'Budget'},informes:{name:'Informes'},proyeccion:{name:'Proyección Anual'},usuarios:{name:'Crear Perfiles y Usuarios'},claves:{name:'Generar Claves de Acceso'},config:{name:'Configuración'}};
const MODICON={dashboard:'dashboard',mina:'mina',planta:'planta',budget:'budget',informes:'informes',proyeccion:'proyeccion',usuarios:'usuarios',claves:'key',config:'config'};
const ADMIN_MODS=['usuarios','claves','config'];
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MES_ACTUAL=5, ANIO=2026;

/* ===== Estado ===== */
let DB={}, SESSION=null, CURRENT='dashboard', EDIT_AREA={}, INF_FILTER='all', CFG_TAB='datos';

/* ===== Helpers ===== */
const $=(s,r)=>(r||document).querySelector(s);
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('es-CL');
const fmtM=n=>n==null?'—':'$'+(n/1000).toLocaleString('es-CL',{maximumFractionDigits:1})+'M';
const fmtK=n=>n==null?'—':'$'+Math.round(n).toLocaleString('es-CL')+'k';
function uid(p){return p+Math.random().toString(36).slice(2,7);}
function slug(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'');}
function roleOf(u){return DB.roles.find(r=>r.id===(u&&u.role_id));}
function perms(){if(!SESSION)return[];const r=roleOf(SESSION);return r?(r.perms||[]):[];}
function can(m){return perms().indexOf(m)>=0;}
function canEdit(){const r=roleOf(SESSION);return !(r&&r.view_only);}
function isAdmin(){const r=roleOf(SESSION);return !!(r&&(r.id==='r0'||(r.perms||[]).indexOf('config')>=0||(r.perms||[]).indexOf('usuarios')>=0));}
function curFaena(){return $('#mineSel')?$('#mineSel').value:'mb';}
function areasOf(f,t){return DB.areas.filter(a=>a.faena===f&&(!t||t==='all'||a.tipo===t));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function modName(id){return MODULES[id]?MODULES[id].name:(((DB.modules||[]).find(m=>m.id===id)||{}).name||'');}

/* ===== Cálculos ===== */
function C(id){return DB.costs[id]||{budget:Array(12).fill(0),real:Array(12).fill(null)};}
function areaTotals(id){const c=C(id);let bA=0,rA=0,bAn=0;for(let m=0;m<12;m++){bAn+=c.budget[m]||0;if(m<=MES_ACTUAL){bA+=c.budget[m]||0;rA+=c.real[m]||0;}}const f=bA?rA/bA:1;let p=rA;for(let m=MES_ACTUAL+1;m<12;m++)p+=Math.round((c.budget[m]||0)*((f+1)/2));return{bAcum:bA,rAcum:rA,bAnual:bAn,proy:p};}
function faenaTotals(f,t){const ar=areasOf(f,t);let o={bAcum:0,rAcum:0,bAnual:0,proy:0};ar.forEach(a=>{const x=areaTotals(a.id);o.bAcum+=x.bAcum;o.rAcum+=x.rAcum;o.bAnual+=x.bAnual;o.proy+=x.proy;});o.dev=o.bAcum?(o.rAcum-o.bAcum)/o.bAcum:0;o.devAnual=o.bAnual?(o.proy-o.bAnual)/o.bAnual:0;return o;}
function monthly(f,t){const ar=areasOf(f,t);const b=Array(12).fill(0),r=Array(12).fill(0);ar.forEach(a=>{const c=C(a.id);for(let m=0;m<12;m++){b[m]+=c.budget[m]||0;if(c.real[m]!=null)r[m]+=c.real[m];}});return{b:b,r:r.map((v,m)=>m<=MES_ACTUAL?v:null)};}

/* ===== Gráfico SVG (sin librerías) ===== */
function barChart(labels,budget,real){const W=Math.max(380,labels.length*46),H=200,base=H-22,top=14;
  const vals=budget.concat(real.filter(x=>x!=null));const max=Math.max(1,...vals);const bw=(W-20)/labels.length;let s='';
  for(let i=0;i<labels.length;i++){const x=10+i*bw;const bh=(budget[i]/max)*(base-top),rh=(real[i]!=null?(real[i]/max)*(base-top):0);
    s+='<rect x="'+(x+bw*0.16)+'" y="'+(base-bh)+'" width="'+(bw*0.30)+'" height="'+bh+'" fill="rgba(91,140,179,.65)" rx="2"/>';
    if(real[i]!=null)s+='<rect x="'+(x+bw*0.50)+'" y="'+(base-rh)+'" width="'+(bw*0.30)+'" height="'+rh+'" fill="#e27b2e" rx="2"/>';
    s+='<text x="'+(x+bw*0.47)+'" y="'+(H-6)+'" fill="#90a4ba" font-size="9" text-anchor="middle">'+labels[i]+'</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100%">'+s+'</svg>'+
    '<div style="display:flex;gap:16px;justify-content:center;font-size:11px;color:var(--muted);margin-top:6px"><span><span style="display:inline-block;width:10px;height:10px;background:rgba(91,140,179,.65);border-radius:2px"></span> Budget</span><span><span style="display:inline-block;width:10px;height:10px;background:#e27b2e;border-radius:2px"></span> Real</span></div>';}

/* ===== AUTH ===== */
async function doLogin(){const u=$('#lg_user').value.trim(),p=$('#lg_pass').value;if(!u||!p){$('#lg_err').textContent='Ingresa usuario y contraseña.';return;}
  const btn=$('#lg_btn');btn.innerHTML='<span class="spin"></span>';$('#lg_err').textContent='';
  const email=(u.indexOf('@')>=0?u:slug(u)+EMAIL_DOMAIN);
  try{
    const r=await fetch(SB_BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'content-type':'application/json'},body:JSON.stringify({email:email,password:p})});
    const j=await r.json();
    if(!j.access_token){$('#lg_err').textContent='Usuario o contraseña incorrectos.';btn.textContent='Ingresar';return;}
    TOKEN=j.access_token;const myId=j.user.id;
    await fetchAll();
    SESSION=DB.users.find(x=>x.id===myId)||{id:myId,name:email,role_id:'rv'};
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    $('#mineSel').innerHTML=DB.faenas.map(f=>'<option value="'+f.id+'">'+f.name+'</option>').join('');
    CURRENT=perms()[0]||'dashboard';buildNav();render();
  }catch(e){$('#lg_err').textContent='Error de conexión: '+e.message;btn.textContent='Ingresar';}
}
function logout(){TOKEN=null;SESSION=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#lg_pass').value='';$('#lg_btn').textContent='Ingresar';}
function toggleSidebar(o){const sb=$('#sidebar'),ov=$('#sbOverlay');if(o){sb.classList.add('open');ov.classList.add('show');}else{sb.classList.remove('open');ov.classList.remove('show');}}

/* ===== Carga de datos ===== */
async function fetchAll(){
  const [faenas,roles,areas,rtypes,reports,costs,profiles,settings,modules]=await Promise.all([
    rest('mantos_faenas?select=*&order=name'),rest('mantos_roles?select=*'),rest('mantos_areas?select=*'),
    rest('mantos_report_types?select=*'),rest('mantos_reports?select=*&order=fecha.desc'),rest('mantos_costs?select=*'),
    rest('mantos_profiles?select=*'),rest('mantos_settings?select=*'),rest('mantos_modules?select=*')]);
  DB.faenas=faenas;DB.roles=roles;DB.areas=areas;DB.reportTypes=rtypes;DB.reports=reports;DB.users=profiles;DB.modules=modules||[];
  DB.settings={};(settings||[]).forEach(s=>DB.settings[s.key]=s.value);
  DB.costs={};areas.forEach(a=>DB.costs[a.id]={budget:Array(12).fill(0),real:Array(12).fill(null)});
  costs.forEach(c=>{if(!DB.costs[c.area_id])DB.costs[c.area_id]={budget:Array(12).fill(0),real:Array(12).fill(null)};DB.costs[c.area_id].budget[c.month]=c.budget==null?0:Number(c.budget);DB.costs[c.area_id].real[c.month]=c.real==null?null:Number(c.real);});
}
async function refreshData(){const b=$('#refBtn');b.innerHTML='<span class="spin"></span>';try{await fetchAll();render();toast('Datos actualizados');}catch(e){toast('Error al actualizar');}b.innerHTML=ic('refresh',17);}

/* ===== NAV / RENDER ===== */
function navItem(id,icon,name){return '<div class="sb-item '+(id===CURRENT?'on':'')+'" onclick="go(\''+id+'\')"><span class="ni">'+ic(icon)+'</span><span>'+name+'</span></div>';}
function buildNav(){const top=Object.keys(MODULES).filter(m=>ADMIN_MODS.indexOf(m)<0&&can(m)).map(m=>navItem(m,MODICON[m],MODULES[m].name));
  const cust=(DB.modules||[]).filter(m=>can(m.id)).map(m=>navItem(m.id,m.icon||'dashboard',m.name));
  const adm=ADMIN_MODS.filter(m=>can(m)).map(m=>navItem(m,MODICON[m],MODULES[m].name));
  $('#nav').innerHTML=top.concat(cust,adm).join('');}
function go(m){if(!can(m))return;CURRENT=m;buildNav();render();toggleSidebar(false);$('.content').scrollTop=0;}
function render(){if(!SESSION)return;$('#tb_name').textContent=SESSION.name;$('#tb_role').textContent=(roleOf(SESSION)||{}).name||'';$('#tbTitle').textContent=modName(CURRENT);
  const cm=(DB.modules||[]).find(m=>m.id===CURRENT);
  const fns={dashboard:viewDashboard,mina:function(){return viewCostos('mina');},planta:function(){return viewCostos('planta');},budget:viewBudget,informes:viewInformes,proyeccion:viewProyeccion,usuarios:viewUsuarios,claves:viewClaves,config:viewConfig};
  $('#viewport').innerHTML=cm?viewCustom(cm):((fns[CURRENT]||viewDashboard)());}

/* ===== Vistas ===== */
function viewDashboard(){const f=curFaena(),fn=(DB.faenas.find(x=>x.id===f)||{}).name||'';const tot=faenaTotals(f),mi=faenaTotals(f,'mina'),pl=faenaTotals(f,'planta');const s=monthly(f,null);
  const dev=(tot.dev>0?'+':'')+(tot.dev*100).toFixed(1)+'%';
  let ar=areasOf(f);let dist=ar.map(a=>{const t=areaTotals(a.id);return {n:a.name,v:t.rAcum};}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);const mx=Math.max(1,...dist.map(d=>d.v));
  return '<div class="crumb">'+ic('dashboard',13)+' Faena · '+fn+'</div><h2 class="title">Dashboard General</h2>'+
   '<div class="statwrap"><div class="ministat"><div class="l">Real acumulado</div><div class="v">'+fmtM(tot.rAcum)+'</div></div>'+
   '<div class="ministat"><div class="l">Budget acumulado</div><div class="v">'+fmtM(tot.bAcum)+'</div></div>'+
   '<div class="ministat"><div class="l">Desviación</div><div class="v" style="color:'+(tot.dev>0?'var(--bad)':'var(--ok)')+'">'+dev+'</div></div>'+
   '<div class="ministat"><div class="l">Proyección año</div><div class="v">'+fmtM(tot.proy)+'</div></div></div>'+
   '<div class="grid g2" style="margin-top:13px"><div class="card kpi accent"><div class="lbl">'+ic('mina',14)+' Costo Mina</div><div class="val">'+fmtM(mi.rAcum)+'</div><span class="delta '+(mi.dev>0?'up':'down')+'">'+(mi.dev>0?'+':'')+(mi.dev*100).toFixed(1)+'% vs budget</span></div>'+
   '<div class="card kpi accent"><div class="lbl">'+ic('planta',14)+' Costo Planta</div><div class="val">'+fmtM(pl.rAcum)+'</div><span class="delta '+(pl.dev>0?'up':'down')+'">'+(pl.dev>0?'+':'')+(pl.dev*100).toFixed(1)+'% vs budget</span></div></div>'+
   '<div class="sectit"><span class="lft">Real vs Budget · '+ANIO+'</span><span class="pill">kUSD / mes</span></div><div class="chartbox">'+barChart(MESES,s.b,s.r)+'</div>'+
   '<div class="sectit"><span class="lft">Distribución de costo por área</span></div><div class="card">'+(dist.length?dist.map(d=>'<div class="barrow"><div class="top"><b>'+d.n+'</b><span class="n">'+fmtK(d.v)+'</span></div><div class="track"><div class="fill" style="width:'+(d.v/mx*100)+'%"></div></div></div>').join(''):'<div class="empty">Sin datos</div>')+'</div>'+
   '<div class="sectit"><span class="lft">Proyección de cierre de año</span></div><div class="card"><div class="barrow"><div class="top"><b>Real proyectado</b><span class="n">'+fmtM(tot.proy)+' / '+fmtM(tot.bAnual)+'</span></div><div class="track"><div class="fill '+(tot.proy>tot.bAnual?'bad':'ok')+'" style="width:'+Math.min(100,tot.bAnual?tot.proy/tot.bAnual*100:0)+'%"></div></div></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px"><div class="val" style="font-size:20px;font-weight:800">'+fmtM(tot.proy)+'</div><span class="tag '+(tot.devAnual>0?'bad':'ok')+'">'+(tot.devAnual>0?'+':'')+(tot.devAnual*100).toFixed(1)+'% vs budget</span></div></div>';}

function viewCostos(tipo){const f=curFaena();const t=faenaTotals(f,tipo);const ar=areasOf(f,tipo);const s=monthly(f,tipo);
  const bars=ar.map(a=>{const at=areaTotals(a.id);const dv=at.bAcum?(at.rAcum-at.bAcum)/at.bAcum:0;const pct=at.bAcum?Math.min(140,at.rAcum/at.bAcum*100):0;const cls=dv>0.03?'bad':dv<-0.03?'ok':'';
    return '<div class="barrow"><div class="top"><b>'+a.name+'</b><span class="n">'+fmtK(at.rAcum)+' / '+fmtK(at.bAcum)+' <b style="color:'+(dv>0?'var(--bad)':'var(--ok)')+'">'+(dv>0?'+':'')+(dv*100).toFixed(0)+'%</b></span></div><div class="track"><div class="fill '+cls+'" style="width:'+Math.min(100,pct)+'%"></div></div></div>';}).join('');
  return '<div class="crumb">'+ic(tipo,13)+' '+((DB.faenas.find(x=>x.id===f)||{}).name||'')+'</div><h2 class="title">'+(tipo==='mina'?'Costos Mina':'Costos Planta')+'</h2>'+
   '<div class="grid g2" style="margin-top:12px"><div class="card kpi"><div class="lbl">Real acumulado</div><div class="val">'+fmtM(t.rAcum)+'</div><span class="delta '+(t.dev>0?'up':'down')+'">'+(t.dev>0?'+':'')+(t.dev*100).toFixed(1)+'%</span></div>'+
   '<div class="card kpi"><div class="lbl">Budget acumulado</div><div class="val">'+fmtM(t.bAcum)+'</div><span class="delta flat">'+ar.length+' áreas</span></div>'+
   '<div class="card kpi"><div class="lbl">Proyección año</div><div class="val">'+fmtM(t.proy)+'</div><span class="delta '+(t.devAnual>0?'up':'down')+'">'+(t.devAnual>0?'+':'')+(t.devAnual*100).toFixed(1)+'%</span></div></div>'+
   '<div class="sectit"><span class="lft">Evolución mensual</span><span class="pill">Real vs Budget</span></div><div class="chartbox">'+barChart(MESES,s.b,s.r)+'</div>'+
   (canEdit()?('<div class="sectit"><span class="lft">'+ic('edit',16)+' Cargar / editar datos</span><span class="pill">en vivo · kUSD</span></div><div class="banner">'+ic('edit',18)+'<div>Edita Budget y Real por mes. Se guarda en la nube y todos lo ven al actualizar.</div></div>'+editGrid(tipo)):'')+
   '<div class="sectit"><span class="lft">Desglose por área</span></div><div class="card">'+(bars||'<div class="empty">Sin áreas</div>')+'</div>';}

function editGrid(tipo){const f=curFaena();const ar=areasOf(f,tipo);
  if(!ar.length)return '<div class="card"><div class="empty">Sin áreas.</div><div class="addrow"><input id="qa_name" placeholder="Nueva área"><button class="btn sm" onclick="quickAddArea(\''+f+'\',\''+(tipo==='all'?'mina':tipo)+'\')">'+ic('plus',15)+' Área</button></div></div>';
  let sel=EDIT_AREA[tipo];if(!sel||!ar.find(a=>a.id===sel))sel=ar[0].id;EDIT_AREA[tipo]=sel;const c=C(sel);
  const opts=ar.map(a=>'<option value="'+a.id+'" '+(a.id===sel?'selected':'')+'>'+a.name+'</option>').join('');
  let rows='',tb=0,tr=0;for(let m=0;m<12;m++){const bv=c.budget[m],rv=c.real[m];tb+=bv||0;tr+=rv||0;
    rows+='<tr><td>'+MESES[m]+' '+ANIO+'</td><td><input type="number" class="cell" value="'+(bv==null?'':bv)+'" onchange="setCost(\''+sel+'\','+m+',\'budget\',this.value)"></td><td><input type="number" class="cell" value="'+(rv==null?'':rv)+'" onchange="setCost(\''+sel+'\','+m+',\'real\',this.value)"></td><td class="'+(rv!=null&&bv?(rv>bv?'neg':'pos'):'')+'">'+(rv!=null&&bv?((rv-bv)/bv*100).toFixed(0)+'%':'—')+'</td></tr>';}
  const at=tipo==='all'?'mina':tipo;
  return '<div class="editbar"><select onchange="EDIT_AREA[\''+tipo+'\']=this.value;render()">'+opts+'</select><button class="btn sm danger" onclick="delArea(\''+sel+'\')">'+ic('trash',15)+' Eliminar área</button></div>'+
   '<div class="card nopad"><table class="tbl grid"><thead><tr><th>Mes</th><th>Budget</th><th>Real</th><th>Desv</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>TOTAL</td><td>'+fmt(tb)+'</td><td>'+fmt(tr)+'</td><td>'+(tb?(((tr-tb)/tb)*100).toFixed(0)+'%':'—')+'</td></tr></tfoot></table></div>'+
   '<div class="addrow"><input id="qa_name" placeholder="Agregar área ('+at+')"><button class="btn sm" onclick="quickAddArea(\''+f+'\',\''+at+'\')">'+ic('plus',15)+' Área</button></div>';}

function viewBudget(){const f=curFaena();const mi=faenaTotals(f,'mina'),pl=faenaTotals(f,'planta'),tot=faenaTotals(f);const s=monthly(f,null);

  return '<div class="crumb">'+ic('budget',13)+' Presupuesto '+ANIO+'</div><h2 class="title">Budget</h2>'+
   '<div class="statwrap"><div class="ministat"><div class="l">Budget anual</div><div class="v">'+fmtM(tot.bAnual)+'</div></div><div class="ministat"><div class="l">Ejecutado</div><div class="v">'+fmtM(tot.rAcum)+'</div></div><div class="ministat"><div class="l">% ejecución</div><div class="v">'+(tot.bAnual?((tot.rAcum/tot.bAnual)*100).toFixed(0):0)+'%</div></div><div class="ministat"><div class="l">Saldo</div><div class="v">'+fmtM(tot.bAnual-tot.rAcum)+'</div></div></div>'+
   '<div class="sectit"><span class="lft">Budget mensual vs Real</span></div><div class="chartbox">'+barChart(MESES,s.b,s.r)+'</div>'+
   '<div class="sectit"><span class="lft">Resumen presupuestario</span></div><div class="card"><table class="tbl"><tr><th>Segmento</th><th>Budget</th><th>Proy.</th><th>Desv.</th></tr>'+rows+'</table></div>'+
   (canEdit()?('<div class="sectit"><span class="lft">'+ic('edit',16)+' Editar presupuesto por área</span></div>'+editGrid('all')):'');}

function viewProyeccion(){const f=curFaena();const tot=faenaTotals(f);const dev=tot.devAnual;const s=monthly(f,null);
  let bAcc=0,rAcc=0;const lab=[],bud=[],real=[];let fac=(function(){let b=0,r=0;for(let m=0;m<=MES_ACTUAL;m++){b+=s.b[m];r+=s.r[m]||0;}return b?r/b:1;})();let p=0;
  for(let m=0;m<12;m++){bAcc+=s.b[m];lab.push(MESES[m]);bud.push(bAcc);if(m<=MES_ACTUAL){rAcc+=s.r[m]||0;p=rAcc;real.push(rAcc);}else{p+=Math.round(s.b[m]*((fac+1)/2));real.push(p);}}
  return '<div class="crumb">'+ic('proyeccion',13)+' '+((DB.faenas.find(x=>x.id===f)||{}).name||'')+'</div><h2 class="title">Proyección Anual</h2>'+
   '<div class="grid g2" style="margin-top:12px"><div class="card kpi accent"><div class="lbl">Cierre proyectado</div><div class="val">'+fmtM(tot.proy)+'</div><span class="delta '+(dev>0?'up':'down')+'">'+(dev>0?'+':'')+(dev*100).toFixed(1)+'% vs budget</span></div><div class="card kpi"><div class="lbl">Budget anual</div><div class="val">'+fmtM(tot.bAnual)+'</div><span class="delta flat">meta '+ANIO+'</span></div></div>'+
   '<div class="sectit"><span class="lft">Acumulado: Budget vs Real+Proyección</span></div><div class="chartbox">'+barChart(lab,bud,real)+'</div>'+
   '<div class="card" style="margin-top:13px"><div class="muted" style="margin-bottom:8px">Lógica</div><p class="muted" style="line-height:1.6;margin:0">Real acumulado a '+MESES[MES_ACTUAL]+' + budget restante ajustado por el factor de desempeño actual ('+(tot.bAcum?(tot.rAcum/tot.bAcum).toFixed(2):'1')+').</p></div>';}

function viewInformes(){const f=curFaena();const ts=DB.reportTypes;const list=DB.reports.filter(r=>r.faena===f&&(INF_FILTER==='all'||r.type===INF_FILTER));

  return '<div class="crumb">'+ic('informes',13)+' '+((DB.faenas.find(x=>x.id===f)||{}).name||'')+'</div><h2 class="title">Informes</h2>'+chips+(rows||'<div class="empty">Sin informes.</div>')+(isAdmin()?'<button class="btn ghost" style="margin-top:8px;width:auto" onclick="openNewReport()">'+ic('plus',15)+' Nuevo informe</button>':'');}

function viewUsuarios(){if(!can('usuarios'))return '<div class="empty">Sin acceso.</div>';
  const allMods=Object.keys(MODULES).map(m=>({id:m,name:MODULES[m].name,icon:MODICON[m]})).concat((DB.modules||[]).map(m=>({id:m.id,name:m.name,icon:m.icon||'dashboard'})));
  const cards=DB.roles.map(r=>{const chips=allMods.map(m=>'<div class="chip '+((r.perms||[]).indexOf(m.id)>=0?'on':'')+'" onclick="togglePerm(\''+r.id+'\',\''+m.id+'\')">'+ic(m.icon,14)+' '+m.name+'</div>').join('');const n=DB.users.filter(u=>u.role_id===r.id).length;

  return '<div class="crumb">'+ic('usuarios',13)+' Administración de accesos</div><h2 class="title">Crear Perfiles y Usuarios</h2>'+
   '<p class="muted" style="line-height:1.6;margin-bottom:6px">Los accesos se asignan por <b style="color:var(--copper2)">perfil de cargo</b>. Cada usuario hereda los módulos de su cargo.</p>'+
   '<div class="sectit"><span class="lft">'+ic('plus',16)+' Nuevo cargo</span></div><div class="card"><div class="addrow"><input id="nrole_name" placeholder="Nombre del cargo"><button class="btn sm" onclick="addRole()">'+ic('plus',15)+' Agregar</button></div></div>'+
   '<div class="sectit"><span class="lft">'+ic('shield',16)+' Perfiles de cargo</span></div>'+cards+

function viewCustom(mod){const ed=canEdit();const cols=mod.cols||[],rows=mod.rows||[];
  const head='<div class="crumb">'+ic(mod.icon||'dashboard',13)+' Módulo</div><h2 class="title">'+mod.name+'</h2>'+(mod.descr?'<p class="muted" style="margin-bottom:6px">'+mod.descr+'</p>':'');
  const ctr=ed?'<div class="card"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('upload',16)+' Cargar datos (CSV)</span></div><p class="muted" style="line-height:1.6">Sube un CSV (separado por coma o ;). Primera fila = títulos. Si hay columna <b style="color:var(--copper2)">Área</b> y columnas numéricas, calcula por área y total compañía.</p><input type="file" id="cmFile" accept=".csv,.txt" style="margin:8px 0"><div class="flexbtns"><button class="btn" style="width:auto" onclick="importCSV(\''+mod.id+'\')">'+ic('upload',16)+' Importar</button>'+(rows.length?'<button class="btn ghost" style="width:auto" onclick="clearCustom(\''+mod.id+'\')">'+ic('trash',16)+' Limpiar</button>':'')+'</div></div>':'';
  if(!rows.length)return head+ctr+'<div class="empty">Sin datos aún.</div>';
  const aIdx=cols.findIndex(c=>/área|area/i.test(''+c));const nIdx=cols.map((c,i)=>i).filter(i=>i!==aIdx&&rows.some(r=>r[i]!==''&&r[i]!=null&&!isNaN(parseFloat(r[i]))));
  const tot=nIdx.map(i=>rows.reduce((s,r)=>s+(parseFloat(r[i])||0),0));
  const stat='<div class="statwrap">'+(nIdx.length?nIdx.map((i,k)=>'<div class="ministat"><div class="l">'+cols[i]+' · compañía</div><div class="v">'+tot[k].toLocaleString('es-CL',{maximumFractionDigits:1})+'</div></div>').join(''):'<div class="ministat"><div class="l">Filas</div><div class="v">'+rows.length+'</div></div>')+'</div>';
  let per='';if(aIdx>=0&&nIdx.length){const g={};rows.forEach(r=>{const a=(''+(r[aIdx]==null?'—':r[aIdx])).trim()||'—';if(!g[a])g[a]=nIdx.map(()=>0);nIdx.forEach((i,k)=>g[a][k]+=parseFloat(r[i])||0);});
    const h2='<tr><th>Área</th>'+nIdx.map(i=>'<th>'+cols[i]+'</th>').join('')+'</tr>';const bd=Object.keys(g).map(a=>'<tr><td>'+a+'</td>'+g[a].map(v=>'<td>'+v.toLocaleString('es-CL',{maximumFractionDigits:1})+'</td>').join('')+'</tr>').join('');const tt='<tr><td>TOTAL COMPAÑÍA</td>'+tot.map(v=>'<td>'+v.toLocaleString('es-CL',{maximumFractionDigits:1})+'</td>').join('')+'</tr>';
    const labels=Object.keys(g),vals=labels.map(a=>g[a][0]);per='<div class="sectit"><span class="lft">Métrica final por área y compañía</span></div><div class="card nopad" style="overflow-x:auto"><table class="tbl"><thead>'+h2+'</thead><tbody>'+bd+'</tbody><tfoot>'+tt+'</tfoot></table></div><div class="sectit"><span class="lft">'+cols[nIdx[0]]+' por área</span></div><div class="chartbox">'+barChart(labels,vals,vals.map(()=>null))+'</div>';}
  const rh='<tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';const rb=rows.slice(0,60).map(r=>'<tr>'+cols.map((c,i)=>'<td>'+(r[i]==null?'':r[i])+'</td>').join('')+'</tr>').join('');
  return head+ctr+stat+per+'<div class="sectit"><span class="lft">Datos cargados</span><span class="pill">'+rows.length+' filas</span></div><div class="card nopad" style="overflow-x:auto"><table class="tbl">'+rh+rb+'</table></div>';}

function viewConfig(){if(!can('config'))return '<div class="empty">Sin acceso.</div>';
  const tabs=[['datos','Datos / Excel'],['subir','Subir Informes a Área'],['informes','Informes'],['modulos','Módulos'],['areas','Áreas'],['tipos','Tipos de informe']];
  const body={datos:cfgDatos,subir:cfgSubir,informes:cfgInformes,modulos:cfgModules,areas:cfgAreas,tipos:cfgTipos}[CFG_TAB]();
  return '<div class="crumb">'+ic('config',13)+' Administración</div><h2 class="title">Configuración</h2><div class="tabs">'+tabs.map(t=>'<button class="'+(CFG_TAB===t[0]?'on':'')+'" onclick="cfgTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>'+body;}
function cfgTab(t){CFG_TAB=t;render();}
function cfgDatos(){const url=location.origin+location.pathname;return '<div class="card"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('upload',16)+' Cargar planilla Excel</span><span class="pill">.xlsx / .csv</span></div><p class="muted" style="line-height:1.6">Columnas: <b style="color:var(--copper2)">Área · Mes · Budget · Real</b>. Se vinculan por nombre de área. Se guarda en la nube y todos lo ven.</p><input type="file" id="xlsFile" accept=".xlsx,.xls,.csv" style="margin:8px 0"><div class="flexbtns"><button class="btn" style="width:auto" onclick="importExcel()">'+ic('upload',16)+' Importar a la nube</button><button class="btn ghost" style="width:auto" onclick="downloadTemplate()">'+ic('download',16)+' Plantilla modelo</button><button class="btn ghost" style="width:auto" onclick="openTplEditor()">'+ic('edit',16)+' Modificar modelo Excel</button></div></div>'+'<div class="card" style="margin-top:13px"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('share',16)+' Compartir la plataforma</span></div><p class="muted" style="line-height:1.6">Esta es tu plataforma EN VIVO. Comparte este link con tu equipo y gerente; entran con su usuario y clave y ven los mismos datos.</p><div class="field"><label>Link público</label><input readonly value="'+url+'" onclick="this.select()"></div><div class="flexbtns"><button class="btn wa" style="width:auto" onclick="shareApp()">'+ic('share',16)+' Compartir por WhatsApp</button></div></div>'+
   '<div class="card" style="margin-top:13px"><div class="sectit" style="margin-top:0"><span class="lft">Estado del sistema</span></div><div class="perm"><span>Faenas</span><b>'+DB.faenas.length+'</b></div><div class="perm"><span>Áreas</span><b>'+DB.areas.length+'</b></div><div class="perm"><span>Usuarios</span><b>'+DB.users.length+'</b></div><div class="perm"><span>Conexión</span><b style="color:var(--ok)">En la nube ✓</b></div></div>';}
function cfgModules(){const list=(DB.modules||[]).map(m=>'<div class="lrow"><div class="ic">'+ic(m.icon||'dashboard',20)+'</div><div class="mid"><b>'+m.name+'</b><span>'+((m.rows&&m.rows.length)?m.rows.length+' filas':'sin datos')+(m.descr?' · '+m.descr:'')+'</span></div><button class="iconbtn" onclick="delCustomModule(\''+m.id+'\')">'+ic('trash',16)+'</button></div>').join('');
  const icons=['dashboard','mina','planta','budget','informes','proyeccion','doc','shield','key','check'];
  return '<p class="muted" style="line-height:1.6">Crea módulos propios. Aparecen en el panel izquierdo y permiten cargar CSV y ver métrica por área y compañía.</p>'+(list||'<div class="empty">Sin módulos.</div>')+
   '<div class="card" style="margin-top:8px"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('plus',16)+' Nuevo módulo</span></div><div class="field"><label>Nombre</label><input id="nm_name" placeholder="Ej: Producción"></div><div class="field"><label>Descripción</label><input id="nm_desc" placeholder="opcional"></div><div class="field"><label>Ícono</label><select id="nm_icon">'+icons.map(i=>'<option value="'+i+'">'+i+'</option>').join('')+'</select></div><button class="btn" style="width:auto" onclick="addCustomModule()">'+ic('plus',16)+' Crear módulo</button></div>';}
function cfgAreas(){const f=curFaena();const list=DB.areas.filter(a=>a.faena===f).map(a=>'<div class="lrow"><div class="ic">'+ic(a.tipo,20)+'</div><div class="mid"><b>'+a.name+'</b><span>'+(a.tipo==='mina'?'Mina':'Planta')+'</span></div><button class="iconbtn" onclick="delArea(\''+a.id+'\')">'+ic('trash',16)+'</button></div>').join('');
  return '<p class="muted">Áreas de <b style="color:var(--copper2)">'+((DB.faenas.find(x=>x.id===f)||{}).name||'')+'</b>.</p>'+(list||'<div class="empty">Sin áreas.</div>')+'<div class="card" style="margin-top:8px"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('plus',16)+' Agregar área</span></div><div class="field"><label>Nombre</label><input id="na_name" placeholder="Ej: Espesadores"></div><div class="field"><label>Tipo</label><select id="na_tipo"><option value="mina">Mina</option><option value="planta">Planta</option></select></div><button class="btn" style="width:auto" onclick="addAreaCfg(\''+f+'\')">'+ic('plus',16)+' Agregar</button></div>';}
function cfgTipos(){const list=DB.reportTypes.map(t=>'<div class="lrow"><div class="ic">'+ic('doc',20)+'</div><div class="mid"><b>'+t.name+'</b><span>'+(t.key||'')+'</span></div><button class="iconbtn" onclick="delTipo(\''+t.id+'\')">'+ic('trash',16)+'</button></div>').join('');
  return '<p class="muted">Tipos de informe.</p>'+list+'<div class="card" style="margin-top:8px"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('plus',16)+' Agregar tipo</span></div><div class="field"><label>Nombre</label><input id="nt_name" placeholder="Ej: Forecast"></div><button class="btn" style="width:auto" onclick="addTipo()">'+ic('plus',16)+' Agregar</button></div>';}

/* ===== Mutaciones (escriben en la nube) ===== */
async function setCost(id,m,ds,val){const v=val===''?null:Number(val);DB.costs[id][ds][m]=v;render();
  try{await rest('mantos_costs','POST',{area_id:id,month:m,budget:DB.costs[id].budget[m],real:DB.costs[id].real[m]},'resolution=merge-duplicates');toast('Guardado en la nube');}catch(e){toast('Error: '+e.message);}}
async function quickAddArea(f,tipo){const el=$('#qa_name');const name=el?el.value.trim():'';if(!name)return toast('Escribe un nombre');const id=uid('a');
  try{await rest('mantos_areas','POST',{id:id,faena:f,tipo:tipo,name:name});const rows=[];for(let m=0;m<12;m++)rows.push({area_id:id,month:m,budget:0,real:null});await rest('mantos_costs','POST',rows);DB.areas.push({id:id,faena:f,tipo:tipo,name:name});DB.costs[id]={budget:Array(12).fill(0),real:Array(12).fill(null)};EDIT_AREA[tipo]=id;render();toast('Área agregada');}catch(e){toast('Error: '+e.message);}}
async function addAreaCfg(f){const name=$('#na_name').value.trim();if(!name)return toast('Nombre');const tipo=$('#na_tipo').value;const id=uid('a');
  try{await rest('mantos_areas','POST',{id:id,faena:f,tipo:tipo,name:name});const rows=[];for(let m=0;m<12;m++)rows.push({area_id:id,month:m,budget:0,real:null});await rest('mantos_costs','POST',rows);DB.areas.push({id:id,faena:f,tipo:tipo,name:name});DB.costs[id]={budget:Array(12).fill(0),real:Array(12).fill(null)};render();toast('Área agregada');}catch(e){toast('Error: '+e.message);}}
async function delArea(id){if(!confirm('¿Eliminar área y sus datos?'))return;try{await rest('mantos_areas?id=eq.'+id,'DELETE');DB.areas=DB.areas.filter(a=>a.id!==id);delete DB.costs[id];EDIT_AREA={};render();toast('Área eliminada');}catch(e){toast('Error: '+e.message);}}
async function addRole(){const n=$('#nrole_name').value.trim();if(!n)return toast('Nombre');const id=uid('r');try{await rest('mantos_roles','POST',{id:id,name:n,perms:['dashboard'],view_only:false});DB.roles.push({id:id,name:n,perms:['dashboard'],view_only:false});render();toast('Cargo creado');}catch(e){toast('Error: '+e.message);}}
async function delRole(id){if(DB.users.some(u=>u.role_id===id))return toast('Hay usuarios con este cargo');if(!confirm('¿Eliminar cargo?'))return;try{await rest('mantos_roles?id=eq.'+id,'DELETE');DB.roles=DB.roles.filter(r=>r.id!==id);render();toast('Cargo eliminado');}catch(e){toast('Error: '+e.message);}}
async function togglePerm(rid,m){const r=DB.roles.find(x=>x.id===rid);if(!r)return;const has=(r.perms||[]).indexOf(m)>=0;r.perms=has?r.perms.filter(x=>x!==m):(r.perms||[]).concat([m]);
  try{await rest('mantos_roles?id=eq.'+rid,'PATCH',{perms:r.perms});if(SESSION&&SESSION.role_id===rid){if(!can(CURRENT))CURRENT=perms()[0]||'dashboard';buildNav();}render();}catch(e){toast('Error: '+e.message);}}
async function addUser(){const name=$('#nu_name').value.trim(),u=$('#nu_user').value.trim(),p=$('#nu_pass').value.trim();if(!name||!u||!p)return toast('Completa todo');const un=slug(u);
  try{await rpc('mantos_create_user',{p_email:un+EMAIL_DOMAIN,p_pass:p,p_name:name,p_username:un,p_role:$('#nu_role').value});await fetchAll();render();toast('Usuario creado: '+un);}catch(e){toast('Error: '+e.message);}}
async function genClave(){const name=$('#gc_name').value.trim();if(!name)return toast('Nombre');const u=$('#gc_user').value.trim()||slug(name).split('.').slice(0,2).join('.');const un=slug(u);const p=$('#gc_pass').value.trim()||('mb'+Math.random().toString(36).slice(2,8));
  try{await rpc('mantos_create_user',{p_email:un+EMAIL_DOMAIN,p_pass:p,p_name:name,p_username:un,p_role:$('#gc_role').value});await fetchAll();render();showClave(name,un,p,$('#gc_role').value);}catch(e){toast('Error: '+e.message);}}
function showClave(name,un,p,roleId){const r=DB.roles.find(x=>x.id===roleId)||{};modal('<h3>'+ic('key',18)+' Clave generada</h3><div class="card" style="margin-bottom:12px"><div class="perm"><span>Persona</span><b>'+name+'</b></div><div class="perm"><span>Usuario</span><b style="color:var(--copper2)">'+un+'</b></div><div class="perm"><span>Clave</span><b style="color:var(--copper2)">'+p+'</b></div><div class="perm"><span>Perfil</span><b>'+(r.name||'')+(r.view_only?' (solo ver)':'')+'</b></div></div><button class="btn wa" onclick="shareCred(\''+name+'\',\''+un+'\',\''+p+'\')">'+ic('share',16)+' Enviar por WhatsApp</button><button class="btn ghost" style="margin-top:8px" onclick="closeModal()">Cerrar</button>');}
async function delUser(un){if(SESSION&&SESSION.username===un)return toast('No puedes eliminarte');if(!confirm('¿Eliminar usuario '+un+'?'))return;try{await rpc('mantos_delete_user',{p_username:un});DB.users=DB.users.filter(u=>u.username!==un);render();toast('Usuario eliminado');}catch(e){toast('Error: '+e.message);}}
async function addCustomModule(){const name=$('#nm_name').value.trim();if(!name)return toast('Nombre');const id=uid('m');const mod={id:id,name:name,descr:$('#nm_desc').value.trim(),icon:$('#nm_icon').value,cols:[],rows:[]};
  try{await rest('mantos_modules','POST',mod);DB.modules.push(mod);for(const r of DB.roles){if(r.id==='r0'||(r.perms||[]).indexOf('config')>=0){r.perms=(r.perms||[]).concat([id]);await rest('mantos_roles?id=eq.'+r.id,'PATCH',{perms:r.perms});}}buildNav();render();toast('Módulo creado');}catch(e){toast('Error: '+e.message);}}
async function delCustomModule(id){if(!confirm('¿Eliminar módulo?'))return;try{await rest('mantos_modules?id=eq.'+id,'DELETE');DB.modules=DB.modules.filter(m=>m.id!==id);for(const r of DB.roles){if((r.perms||[]).indexOf(id)>=0){r.perms=r.perms.filter(p=>p!==id);await rest('mantos_roles?id=eq.'+r.id,'PATCH',{perms:r.perms});}}if(CURRENT===id)CURRENT='config';buildNav();render();toast('Módulo eliminado');}catch(e){toast('Error: '+e.message);}}
function importCSV(modId){const file=$('#cmFile').files[0];if(!file)return toast('Selecciona un CSV');const mod=DB.modules.find(m=>m.id===modId);if(!mod)return;const fr=new FileReader();
  fr.onload=async function(e){try{const txt=e.target.result;const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);if(!lines.length)return toast('CSV vacío');const sep=lines[0].indexOf(';')>=0?';':(lines[0].indexOf('\t')>=0?'\t':',');const data=lines.map(l=>l.split(sep).map(c=>c.trim()));mod.cols=data[0];mod.rows=data.slice(1);await rest('mantos_modules?id=eq.'+modId,'PATCH',{cols:mod.cols,rows:mod.rows});render();toast('Cargado: '+mod.rows.length+' filas');}catch(err){toast('Error: '+err.message);}};fr.readAsText(file);}
async function clearCustom(modId){if(!confirm('¿Borrar datos?'))return;const mod=DB.modules.find(m=>m.id===modId);if(!mod)return;mod.cols=[];mod.rows=[];try{await rest('mantos_modules?id=eq.'+modId,'PATCH',{cols:[],rows:[]});render();toast('Datos borrados');}catch(e){toast('Error: '+e.message);}}

function reportViz(r){var cols=r.cols||[];var rows=(r.rows||[]).filter(function(x){return !/total/i.test(''+((x&&x[0])||''));});if(!rows.length)return '';
  var numIdx=cols.map(function(c,i){return i;}).filter(function(i){return i>0&&rows.some(function(x){return x[i]!==''&&x[i]!=null&&!isNaN(parseFloat(x[i]));});});if(!numIdx.length)return '';
  var mi=numIdx[0];var max=Math.max.apply(null,[1].concat(rows.map(function(x){return Math.abs(parseFloat(x[mi])||0);})));
  var totals=numIdx.map(function(i){return rows.reduce(function(s,x){return s+(parseFloat(x[i])||0);},0);});
  var stats='<div class="statwrap">'+numIdx.map(function(i,k){return '<div class="ministat"><div class="l">'+cols[i]+'</div><div class="v">'+totals[k].toLocaleString('es-CL',{maximumFractionDigits:1})+'</div></div>';}).join('')+'</div>';

  return '<div class="sectit"><span class="lft">Resumen · '+cols[mi]+'</span></div>'+stats+'<div class="card">'+bars+'</div>';}

function tplCfg(){return (DB.settings&&DB.settings.tplConfig)||{scope:'all',name:'',cols:['Area','Mes','Budget','Real']};}
function genTemplate(cfg){const f=curFaena();const cols=(cfg.cols&&cfg.cols.length)?cfg.cols.slice():['Area','Mes','Budget','Real'];
  let ars=areasOf(f);if(cfg.scope==='mina')ars=ars.filter(a=>a.tipo==='mina');if(cfg.scope==='planta')ars=ars.filter(a=>a.tipo==='planta');
  const isA=c=>/^(area|área)$/i.test(c),isM=c=>/^mes$/i.test(c),isB=c=>/^budget$/i.test(c),isR=c=>/^real$/i.test(c);
  const hasA=cols.some(isA),hasM=cols.some(isM);
  function cell(col,a,m){if(isA(col))return a?a.name:'';if(isM(col))return m!=null?MESES[m]:'';if(isB(col))return (a&&DB.costs[a.id])?DB.costs[a.id].budget[m]:'';if(isR(col))return (a&&DB.costs[a.id]&&DB.costs[a.id].real[m]!=null)?DB.costs[a.id].real[m]:'';return '';}
  const data=[cols];
  if(hasA&&hasM){ars.forEach(a=>{for(let m=0;m<=MES_ACTUAL;m++)data.push(cols.map(c=>cell(c,a,m)));});}
  else if(hasA){ars.forEach(a=>data.push(cols.map(c=>cell(c,a,null))));}
  else{const n=Math.max(12,cfg.rows||15);for(let i=0;i<n;i++)data.push(cols.map(()=>''));}
  const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,(cfg.sheet||'Planilla'));XLSX.writeFile(wb,'Modelo_'+(cfg.name?cfg.name.replace(/[^a-z0-9]+/gi,'_'):f)+'.xlsx');}

let TPL={scope:'all',name:'',cols:['Area','Mes','Budget','Real']};
const SMART=['Area','Mes','Budget','Real'];
function lc(a){return a.map(c=>c.toLowerCase());}
function syncTpl(){if($('#tp_scope'))TPL.scope=$('#tp_scope').value;if($('#tp_name'))TPL.name=$('#tp_name').value;}

   (chips?'<div class="muted" style="margin:10px 0 5px;font-size:11px">Agregar columna inteligente:</div><div class="chips">'+chips+'</div>':'')+
   '<div class="addrow" style="margin-top:11px"><input id="tp_newcol" placeholder="Columna libre (Ej: Toneladas, Responsable)"><button class="btn sm" onclick="addTplCol()">'+ic('plus',15)+' Agregar</button></div>'+
   '<div style="height:12px"></div>'+
   '<button class="btn" onclick="downloadCustomTpl()">'+ic('download',16)+' Descargar este modelo</button>'+
   '<button class="btn ghost" style="margin-top:8px" onclick="saveTplAndClose()">'+ic('check',16)+' Guardar como modelo por defecto</button>'+
   '<button class="btn ghost" style="margin-top:8px" onclick="closeModal()">Cerrar</button>');
  const nc=$('#tp_newcol');if(nc)nc.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addTplCol();}});}
function importExcel(){const file=$('#xlsFile').files[0];if(!file)return toast('Selecciona un archivo');const f=curFaena();const reader=new FileReader();
  reader.onload=async function(e){try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});const head=rows[0].map(h=>(''+h).toLowerCase());
    const ci={area:head.findIndex(h=>h.indexOf('area')>=0||h.indexOf('área')>=0),mes:head.findIndex(h=>h.indexOf('mes')>=0),bud:head.findIndex(h=>h.indexOf('budget')>=0||h.indexOf('presup')>=0),real:head.findIndex(h=>h.indexOf('real')>=0||h.indexOf('ejec')>=0)};
    if(ci.area<0||ci.mes<0)return toast('No se reconocen columnas Área/Mes');const ups=[];let count=0,created=0;
    for(let i=1;i<rows.length;i++){const row=rows[i];if(!row||row[ci.area]==null)continue;const aname=(''+row[ci.area]).trim();
      const mt=(''+row[ci.mes]).trim().slice(0,3).toLowerCase();const mi=MESES.findIndex(m=>m.toLowerCase()===mt);if(mi<0)continue;
      let area=DB.areas.find(a=>a.faena===f&&a.name.toLowerCase()===aname.toLowerCase());
      if(!area){const id=uid('a');area={id:id,faena:f,tipo:'mina',name:aname};DB.areas.push(area);DB.costs[id]={budget:Array(12).fill(0),real:Array(12).fill(null)};await rest('mantos_areas','POST',{id:id,faena:f,tipo:'mina',name:aname});created++;}
      const c=DB.costs[area.id];if(ci.bud>=0&&row[ci.bud]!==''&&row[ci.bud]!=null)c.budget[mi]=Number(row[ci.bud])||0;
      if(ci.real>=0&&row[ci.real]!==''&&row[ci.real]!=null)c.real[mi]=Number(row[ci.real])||0;
      ups.push({area_id:area.id,month:mi,budget:c.budget[mi],real:c.real[mi]});count++;}
    if(ups.length)await rest('mantos_costs','POST',ups,'resolution=merge-duplicates');render();toast('Importado: '+count+' filas · '+created+' áreas nuevas');
  }catch(err){console.error(err);toast('Error: '+err.message);}};reader.readAsArrayBuffer(file);}
function cfgSubir(){const f=curFaena();const ars=areasOf(f);const opts=ars.map(a=>'<option value="'+a.id+'">'+a.name+' ('+(a.tipo==='mina'?'Mina':'Planta')+')</option>').join('');
  return '<p class="muted" style="line-height:1.6">Elige el área (existente o nueva), sube tu informe Excel y la plataforma lo convierte en dashboard asociado a esa área, en la nube.</p>'+
   '<div class="card"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('upload',16)+' Subir informe a un área</span></div>'+
   '<div class="field"><label>Área destino</label><select id="su_area" onchange="suToggle()">'+opts+'<option value="__new">+ Crear nueva área…</option></select></div>'+
   '<div id="su_newwrap" class="row2" style="display:none"><div class="field"><label>Nombre de la nueva área</label><input id="su_newname" placeholder="Ej: Espesadores"></div><div class="field"><label>Tipo</label><select id="su_newtipo"><option value="mina">Mina</option><option value="planta">Planta</option></select></div></div>'+
   '<div class="banner">'+ic('doc',18)+'<div>El Excel debe traer columnas <b style="color:var(--copper2)">Mes</b> (Ene, Feb…), <b style="color:var(--copper2)">Budget</b> y <b style="color:var(--copper2)">Real</b>. No necesita columna Área: tú la eliges arriba.</div></div>'+
   '<input type="file" id="su_file" accept=".xlsx,.xls,.csv" style="margin:8px 0">'+
   '<button class="btn" style="width:auto" onclick="importToArea(\''+f+'\')">'+ic('upload',16)+' Subir y generar dashboard</button></div>';}
function suToggle(){const v=$('#su_area').value;$('#su_newwrap').style.display=(v==='__new')?'grid':'none';}
function importToArea(f){const file=$('#su_file').files[0];if(!file)return toast('Selecciona un archivo');let areaId=$('#su_area').value;let cName='',cTipo='mina';
  if(areaId==='__new'){cName=$('#su_newname').value.trim();if(!cName)return toast('Escribe el nombre de la nueva área');cTipo=$('#su_newtipo').value;}
  const reader=new FileReader();
  reader.onload=async function(e){try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    if(!rows.length)return toast('Planilla vacía');const head=rows[0].map(h=>(''+h).toLowerCase());
    const mi=head.findIndex(h=>h.indexOf('mes')>=0);const bi=head.findIndex(h=>h.indexOf('budget')>=0||h.indexOf('presup')>=0);const ri=head.findIndex(h=>h.indexOf('real')>=0||h.indexOf('ejec')>=0);
    if(mi<0)return toast('No se encontró la columna Mes');
    if(areaId==='__new'){areaId=uid('a');DB.areas.push({id:areaId,faena:f,tipo:cTipo,name:cName});DB.costs[areaId]={budget:Array(12).fill(0),real:Array(12).fill(null)};await rest('mantos_areas','POST',{id:areaId,faena:f,tipo:cTipo,name:cName});}
    const c=DB.costs[areaId];const ups=[];let n=0;
    for(let i=1;i<rows.length;i++){const row=rows[i];if(!row)continue;const mt=(''+row[mi]).trim().slice(0,3).toLowerCase();const m=MESES.findIndex(x=>x.toLowerCase()===mt);if(m<0)continue;
      if(bi>=0&&row[bi]!==''&&row[bi]!=null)c.budget[m]=Number(row[bi])||0;
      if(ri>=0&&row[ri]!==''&&row[ri]!=null)c.real[m]=Number(row[ri])||0;ups.push({area_id:areaId,month:m,budget:c.budget[m],real:c.real[m]});n++;}
    if(ups.length)await rest('mantos_costs','POST',ups,'resolution=merge-duplicates');
    const area=DB.areas.find(a=>a.id===areaId);CURRENT=area.tipo;EDIT_AREA[area.tipo]=areaId;buildNav();render();toast('Informe cargado a '+area.name+' · '+n+' meses');
  }catch(err){console.error(err);toast('Error: '+err.message);}};reader.readAsArrayBuffer(file);}

/* ===== Modal ===== */

function modalWide(h){$('#modalRoot').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet wide">'+h+'</div></div>';}
function closeModal(){$('#modalRoot').innerHTML='';}
