<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mantos 360">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Mantos Control 360 · Capstone Copper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
<style>
:root{
  --bg:#08111c; --bg2:#0c1a2b; --surface:#11253b; --surface2:#16314d;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --copper:#e27b2e; --copper2:#f0954a; --copper-d:#c25e1b; --steel:#5b8cb3; --navy:#15293b;
  --txt:#eaf1f8; --muted:#90a4ba; --ok:#2fbf71; --warn:#e8b53c; --bad:#ef5a5a;
  --r:16px; --r2:11px; --sbw:252px; --shadow:0 16px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#103049 0,#08111c 55%),var(--bg);color:var(--txt);min-height:100vh}
.hidden{display:none!important}
input,select,textarea{font-family:inherit}
.scroll{overflow-y:auto}
.scroll::-webkit-scrollbar{width:9px;height:9px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
.ico{vertical-align:-3px;flex:none}
.emblem{width:230px;max-width:78vw}.emblem-sm{width:188px;max-width:60vw}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border:none;border-radius:var(--r2);background:linear-gradient(120deg,var(--copper),var(--copper-d));color:#fff;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.3px;transition:.15s;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt);font-weight:600}
.btn.sm{padding:8px 12px;font-size:12.5px;width:auto;border-radius:9px}
.btn.danger{background:linear-gradient(120deg,#e85a5a,#b73b3b)}
.btn.wa{background:linear-gradient(120deg,#2aa75a,#0f8a45)}
input,select,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--txt);font-size:13.5px;outline:none}
input:focus,select:focus{border-color:var(--copper);background:rgba(226,123,46,.06)}
select option{background:#0c1a2b}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.field{margin-bottom:13px}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 22px;background:radial-gradient(700px 380px at 80% 0%,rgba(226,123,46,.16),transparent 60%),linear-gradient(160deg,#0b1c2e,#08111c)}
.ticker{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:18px;text-transform:uppercase;text-align:center}
.loginbox{width:100%;max-width:380px}
.logo-big{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:26px}
.logo-big h1{font-size:21px;margin:0;text-align:center;letter-spacing:.5px}
.logo-big .sub{color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-top:5px}
.demo-creds{margin-top:16px;font-size:11px;color:var(--muted);text-align:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;padding:11px;line-height:1.7}
.demo-creds b{color:var(--copper2)}
.loginerr{color:var(--bad);font-size:12px;text-align:center;min-height:16px;margin-top:6px}
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sbw);flex:none;background:linear-gradient(180deg,#0e2034,#0a1726);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 16px;border-bottom:1px solid var(--line)}
.sb-faena{padding:14px 16px;border-bottom:1px solid var(--line)}
.sb-faena label{display:flex;align-items:center;gap:6px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.sb-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent}
.sb-item:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.sb-item.on{background:linear-gradient(120deg,rgba(226,123,46,.18),rgba(226,123,46,.05));color:var(--copper2);border-color:rgba(226,123,46,.3)}
.sb-item .ni{display:inline-flex;width:22px;justify-content:center}
.sb-user{padding:13px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.who b{font-size:13px;display:block;color:#fff}.who span{font-size:11px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(4,9,16,.6);z-index:35}.sb-overlay.show{display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar2{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(13,59,84,.4),transparent);position:sticky;top:0;backdrop-filter:blur(10px);z-index:30}
.hamb{display:none}.tb-title{font-size:16px;font-weight:700;flex:1}
.tb-upd{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.content{flex:1;overflow-y:auto;padding:22px;max-width:1180px;width:100%;margin:0 auto}
.crumb{font-size:11px;color:var(--copper2);letter-spacing:2px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:7px}
h2.title{font-size:22px;margin:5px 0 4px}
.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.card.nopad{padding:9px}.card.accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--copper)}
.kpi .lbl{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.5px}
.delta{font-size:12px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px}
.delta.up{color:var(--bad);background:rgba(239,90,90,.12)}.delta.down{color:var(--ok);background:rgba(47,191,113,.12)}.delta.flat{color:var(--warn);background:rgba(232,181,60,.12)}
.sectit{font-size:14px;font-weight:700;margin:22px 2px 11px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sectit .lft{display:flex;align-items:center;gap:8px}.sectit .pill{font-size:10px;color:var(--muted);font-weight:600}
.chartbox{background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px;height:230px;position:relative}
.statwrap{display:flex;gap:11px;flex-wrap:wrap;margin:14px 0 4px}
.ministat{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.ministat .l{font-size:10px;color:var(--muted);text-transform:uppercase}.ministat .v{font-size:19px;font-weight:800;margin-top:4px}
.barrow{margin:12px 0}.barrow .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}.barrow .top .n{color:var(--muted)}
.track{height:9px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--copper),var(--copper2))}
.fill.ok{background:linear-gradient(90deg,#26a35f,#39c97a)}.fill.bad{background:linear-gradient(90deg,#c93b3b,#ef6a6a)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:9px 9px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.5px}
.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl tr:last-child td{border-bottom:none}
.tbl.grid td{padding:5px 6px}.tbl tfoot td{font-weight:800;border-top:2px solid var(--line2);color:#fff}
.tbl td.pos{color:var(--ok)}.tbl td.neg{color:var(--bad)}
.cell{width:100%;min-width:74px;padding:7px 8px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--txt);border-radius:7px;font-size:12.5px;text-align:right}
.cell:focus{border-color:var(--copper);background:rgba(226,123,46,.08)}
.tag{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.tag.ok{background:rgba(47,191,113,.15);color:var(--ok)}.tag.bad{background:rgba(239,90,90,.15);color:var(--bad)}.tag.warn{background:rgba(232,181,60,.15);color:var(--warn)}
.lrow{display:flex;align-items:center;gap:13px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:9px}
.lrow .ic{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(226,123,46,.13);color:var(--copper2);font-weight:800;font-size:15px}
.lrow .mid{flex:1;min-width:0}.lrow .mid b{font-size:14px;display:block}.lrow .mid span{font-size:11.5px;color:var(--muted)}
.lrow .end{text-align:right;font-size:12px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;margin-bottom:4px;flex-wrap:wrap}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;width:auto}
.tabs button.on{background:var(--copper);color:#fff;border-color:var(--copper)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{font-size:12px;padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:6px;cursor:pointer}
.chip.on{background:rgba(226,123,46,.18);border-color:var(--copper);color:var(--copper2)}
.perm{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:13px}
.editbar{display:flex;gap:9px;align-items:center;margin:14px 0 9px;flex-wrap:wrap}.editbar select{flex:1;min-width:180px}
.addrow{display:flex;gap:9px;margin-top:11px}.addrow input{flex:1}
.flexbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}
.muted{color:var(--muted);font-size:12.5px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 10px}
.banner{background:linear-gradient(120deg,rgba(226,123,46,.14),rgba(91,140,179,.1));border:1px solid rgba(226,123,46,.25);border-radius:14px;padding:13px 16px;font-size:13px;margin-bottom:6px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.rolehead{display:flex;justify-content:space-between;align-items:center}.rolehead b{font-size:15px}
.rolehead .cnt{font-size:11px;color:var(--muted);background:rgba(255,255,255,.05);padding:3px 10px;border-radius:20px}
.modal{position:fixed;inset:0;background:rgba(4,9,16,.72);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{width:100%;max-width:440px;background:var(--bg2);border-radius:20px;border:1px solid var(--line2);padding:22px;max-height:88vh;overflow-y:auto}
.sheet.wide{max-width:1200px;width:94%;padding:24px 26px}
.sheet h3{margin:0 0 14px;font-size:18px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--copper);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:.25s;box-shadow:var(--shadow)}
.toast.show{opacity:1;bottom:34px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:880px){.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.hamb{display:flex}.content{padding:16px}h2.title{font-size:19px}}

/* ====== Rediseño visual: panel derecho blanco + sidebar azul con profundidad ====== */
.sidebar{
  background:
    radial-gradient(140% 55% at 50% -10%, rgba(72,134,208,.24), transparent 60%),
    linear-gradient(180deg,#133a68 0%,#0d2745 48%,#07182f 100%);
  border-right:1px solid rgba(110,160,220,.18);
  box-shadow:6px 0 34px rgba(4,12,28,.50);
}
.sb-brand,.sb-faena,.sb-user{border-color:rgba(150,195,245,.16)}
.sb-item{transition:.16s}
.sb-item:hover{background:rgba(160,200,245,.12);color:#fff}
.sb-item.on{
  background:linear-gradient(120deg,rgba(240,149,74,.26),rgba(240,149,74,.06));
  color:var(--copper2);border-color:rgba(240,149,74,.42);
  box-shadow:0 8px 20px rgba(0,0,0,.28);
}

/* Panel derecho en tema claro (predomina el blanco) */
.main{
  --txt:#15273b; --muted:#5d738c;
  --surface:#ffffff; --surface2:#eef3fa; --bg2:#f4f8fc;
  --line:rgba(18,44,82,.10); --line2:rgba(18,44,82,.16);
  background:#f6f9fc; color:var(--txt);
}
.main .topbar2{background:rgba(255,255,255,.94);border-bottom:1px solid rgba(18,44,82,.10)}
.main .tb-title,.main h2.title,.main .kpi .val,.main .lrow .mid b,.main .tbl tfoot td{color:#15273b}
.main .crumb{color:#b85c1c}
.main .content{background:#f6f9fc}
.main .card,.main .chartbox{background:linear-gradient(160deg,#ffffff,#f2f7fc);border:1px solid rgba(18,44,82,.09);box-shadow:0 6px 18px rgba(24,56,104,.07)}
.main .ministat{background:#fff;border:1px solid rgba(18,44,82,.09);box-shadow:0 4px 12px rgba(24,56,104,.05)}
.main .lrow,.main .perm{background:#fff;border:1px solid rgba(18,44,82,.09);box-shadow:0 3px 10px rgba(24,56,104,.045)}
.main input,.main select,.main textarea,.main .cell{background:#fff;border:1px solid rgba(18,44,82,.17);color:#15273b}
.main input:focus,.main select:focus,.main .cell:focus{border-color:var(--copper);background:#fff7f0}
.main select option{background:#fff;color:#15273b}
.main .track{background:rgba(18,44,82,.11)}
.main .iconbtn{background:#fff;border:1px solid rgba(18,44,82,.16);color:#3c5476}
.main .iconbtn:hover{background:#eef3fa}
.main .tabs button{background:#fff;border:1px solid rgba(18,44,82,.16);color:#5d738c}
.main .tabs button.on{background:var(--copper);color:#fff;border-color:var(--copper)}
.main .chip{background:#fff;border:1px solid rgba(18,44,82,.16)}
.main .tbl th,.main .tbl td{border-bottom:1px solid rgba(18,44,82,.10)}
.main .tbl tfoot td{border-top:2px solid rgba(18,44,82,.18)}
.main .rolehead .cnt{background:rgba(18,44,82,.06)}

/* ====== Refresh visual v2 — más carácter ====== */
.sb-brand{padding:20px 16px 16px}
.sb-item{font-size:13px;padding:11px 13px;border-radius:12px}
.sb-item.on{box-shadow:0 8px 22px rgba(0,0,0,.30)}
.main .topbar2{padding:15px 24px}
.main .tb-title{font-size:17px;font-weight:800;letter-spacing:-.2px}
.main .sectit .lft{position:relative;padding-left:13px;font-size:14.5px;font-weight:800}
.main .sectit .lft::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--copper2),var(--copper-d))}
.main h2.title{font-size:24px;font-weight:900;letter-spacing:-.6px;margin:6px 0 2px}
.main .card{border-radius:18px}
.main .card.kpi{padding:18px 18px 16px;border-radius:18px;background:linear-gradient(165deg,#fff,#eef4fb);position:relative;overflow:hidden}
.main .card.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(226,123,46,.10),transparent 70%)}
.main .card.kpi .lbl{font-size:11px;font-weight:700;color:#5d738c}
.main .card.kpi .val{font-size:30px;font-weight:900;letter-spacing:-1px;color:#12253a;margin-top:2px}
.main .card.kpi.accent::before{width:5px;background:linear-gradient(180deg,var(--copper2),var(--copper-d))}
.main .statwrap{gap:13px}
.main .ministat{border-radius:16px;padding:15px 16px;border:1px solid rgba(18,44,82,.08);background:#fff;box-shadow:0 6px 16px rgba(24,56,104,.06);position:relative;overflow:hidden;transition:.18s}
.main .ministat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--copper2),var(--steel))}
.main .ministat:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(24,56,104,.10)}
.main .ministat .l{font-size:10px;letter-spacing:.6px;font-weight:700}
.main .ministat .v{font-size:21px;font-weight:900;letter-spacing:-.5px;margin-top:5px}
.main .delta{padding:4px 11px;border-radius:30px;font-weight:800}
.main .delta.up{color:#c0392b;background:rgba(231,76,60,.10)}
.main .delta.down{color:#1e8e54;background:rgba(46,204,113,.12)}
.main .btn{box-shadow:0 8px 18px rgba(226,123,46,.22);border-radius:13px;font-weight:800}
.main .btn:hover{filter:brightness(1.04)}
.main .btn.ghost{box-shadow:none}
.main .btn.wa{box-shadow:0 8px 18px rgba(37,211,102,.25)}
.main .chartbox{border-radius:18px;padding:16px;height:250px;box-shadow:0 6px 18px rgba(24,56,104,.06)}
.main .lrow{border-radius:15px;transition:.16s}
.main .lrow:hover{transform:translateX(2px);box-shadow:0 8px 18px rgba(24,56,104,.09)}
.main .banner{border-radius:15px}
.dropzone{border:2px dashed rgba(18,44,82,.22);border-radius:18px;padding:30px 18px;text-align:center;background:linear-gradient(160deg,#fff,#f1f6fc);cursor:pointer;transition:.18s}
.dropzone:hover,.dropzone.drag{border-color:var(--copper);background:#fff7f0;transform:translateY(-1px)}
.dropzone .dzic{width:54px;height:54px;border-radius:16px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--copper2),var(--copper-d));color:#fff;box-shadow:0 10px 22px rgba(226,123,46,.30)}
.dropzone h4{margin:0 0 4px;font-size:15px;color:#12253a}.dropzone p{margin:0;font-size:12px;color:#5d738c}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 6px}
.mapcell{background:#fff;border:1px solid rgba(18,44,82,.10);border-radius:12px;padding:10px 12px}
.mapcell .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#5d738c;font-weight:700}
.mapcell .v{font-size:13px;font-weight:800;color:#12253a;margin-top:3px}
.mapcell.miss{border-color:rgba(231,76,60,.4)}.mapcell.miss .v{color:#c0392b}
.pill-ok{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#1e8e54;background:rgba(46,204,113,.12);padding:6px 12px;border-radius:30px}
.heroband{background:linear-gradient(120deg,#123a68,#0c2140);border-radius:20px;padding:20px 22px;color:#eaf2fb;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(10,25,55,.22)}
.heroband::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(226,123,46,.22),transparent 70%)}

function rootsOf(f,t){return DB.areas.filter(function(a){return a.faena===f&&(!t||t==='all'||a.tipo===t)&&inScope(a)&&(!a.parent||!DB.areas.some(function(x){return x.id===a.parent;}));}).sort(function(x,y){return (x.orden||0)-(y.orden||0)||String(x.name||'').localeCompare(String(y.name||''));});}
function leafAreasOf(f,t){return areasOf(f,t).filter(isLeaf);}
function nodeTot(id){var ls=leaves(id);var o={bAcum:0,rAcum:0,bAnual:0,proy:0};ls.forEach(function(a){var x=areaTotals(a.id);o.bAcum+=x.bAcum;o.rAcum+=x.rAcum;o.bAnual+=x.bAnual;o.proy+=x.proy;});o.dev=o.bAcum?(o.rAcum-o.bAcum)/o.bAcum:0;o.devAnual=o.bAnual?(o.proy-o.bAnual)/o.bAnual:0;return o;}
function nodeMon(id){var ls=leaves(id);var b=Array(12).fill(0),r=Array(12).fill(0);ls.forEach(function(a){var c=C(a.id);for(var m=0;m<12;m++){b[m]+=c.budget[m]||0;if(c.real[m]!=null)r[m]+=c.real[m];}});return{b:b,r:r.map(function(v,m){return m<=MES_ACTUAL?v:null;})};}
function scopeBanner(){if(!SCOPE||!SCOPE.length)return '';var names=SCOPE.map(function(id){var a=DB.areas.find(function(x){return x.id===id;});return a?a.name:null;}).filter(Boolean);if(!names.length)return '';return '<div class="banner" style="margin-bottom:12px">'+ic('shield',18)+'<div>Tu vista personalizada · <b style="color:var(--copper2)">'+names.join(' · ')+'</b></div></div>';}

/* ===== Cálculos ===== */
function C(id){return DB.costs[id]||{budget:Array(12).fill(0),real:Array(12).fill(null)};}
function areaTotals(id){const c=C(id);let bA=0,rA=0,bAn=0;for(let m=0;m<12;m++){bAn+=c.budget[m]||0;if(m<=MES_ACTUAL){bA+=c.budget[m]||0;rA+=c.real[m]||0;}}const f=bA?rA/bA:1;let p=rA;for(let m=MES_ACTUAL+1;m<12;m++)p+=Math.round((c.budget[m]||0)*((f+1)/2));return{bAcum:bA,rAcum:rA,bAnual:bAn,proy:p};}
function faenaTotals(f,t){const ar=leafAreasOf(f,t);let o={bAcum:0,rAcum:0,bAnual:0,proy:0};ar.forEach(a=>{const x=areaTotals(a.id);o.bAcum+=x.bAcum;o.rAcum+=x.rAcum;o.bAnual+=x.bAnual;o.proy+=x.proy;});o.dev=o.bAcum?(o.rAcum-o.bAcum)/o.bAcum:0;o.devAnual=o.bAnual?(o.proy-o.bAnual)/o.bAnual:0;return o;}
function monthly(f,t){const ar=leafAreasOf(f,t);const b=Array(12).fill(0),r=Array(12).fill(0);ar.forEach(a=>{const c=C(a.id);for(let m=0;m<12;m++){b[m]+=c.budget[m]||0;if(c.real[m]!=null)r[m]+=c.real[m];}});return{b:b,r:r.map((v,m)=>m<=MES_ACTUAL?v:null)};}

async function doLogin(){const u=$('#lg_user').value.trim(),p=$('#lg_pass').value;if(!u||!p){$('#lg_err').textContent='Ingresa usuario y contraseña.';return;}
  const btn=$('#lg_btn');btn.innerHTML='<span class="spin"></span>';$('#lg_err').textContent='';
  const email=(u.indexOf('@')>=0?u:slug(u)+EMAIL_DOMAIN);
  try{
    const r=await fetch(SB_BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'content-type':'application/json'},body:JSON.stringify({email:email,password:p})});
    const j=await r.json();
    if(!j.access_token){$('#lg_err').textContent='Usuario o contraseña incorrectos.';btn.textContent='Ingresar';return;}
    TOKEN=j.access_token;const myId=j.user.id;
    await fetchAll();
    SESSION=DB.users.find(x=>x.id===myId)||{id:myId,name:email,role_id:'rv'};SCOPE=(!isAdmin()&&SESSION.area_ids&&SESSION.area_ids.length)?SESSION.area_ids.slice():null;
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    $('#mineSel').innerHTML=DB.faenas.map(f=>'<option value="'+f.id+'">'+f.name+'</option>').join('');
    CURRENT=perms()[0]||'dashboard';buildNav();render();
  }catch(e){$('#lg_err').textContent='Error de conexión: '+e.message;btn.textContent='Ingresar';}
}

async function fetchAll(){
  const [faenas,roles,areas,rtypes,reports,costs,profiles,settings,modules]=await Promise.all([
    rest('mantos_faenas?select=*&order=name'),rest('mantos_roles?select=*'),rest('mantos_areas?select=*'),
    rest('mantos_report_types?select=*'),rest('mantos_reports?select=*&order=fecha.desc'),rest('mantos_costs?select=*'),
    rest('mantos_profiles?select=*'),rest('mantos_settings?select=*'),rest('mantos_modules?select=*')]);
  DB.faenas=faenas;DB.roles=roles;DB.areas=areas;DB.reportTypes=rtypes;DB.reports=reports;DB.users=profiles;DB.modules=modules||[];
  DB.settings={};(settings||[]).forEach(s=>DB.settings[s.key]=s.value);
  DB.costs={};areas.forEach(a=>DB.costs[a.id]={budget:Array(12).fill(0),real:Array(12).fill(null)});
  costs.forEach(c=>{if(!DB.costs[c.area_id])DB.costs[c.area_id]={budget:Array(12).fill(0),real:Array(12).fill(null)};DB.costs[c.area_id].budget[c.month]=c.budget==null?0:Number(c.budget);DB.costs[c.area_id].real[c.month]=c.real==null?null:Number(c.real);});
  DB.dataUpdated=costs.reduce(function(m,c){return (c.updated_at&&(!m||c.updated_at>m))?c.updated_at:m;},null);
}

function clearCache(){if(!confirm('¿Limpiar la caché y traer la última versión de la plataforma? Se recargará la página.'))return;
  try{if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}}catch(e){}
  try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}}catch(e){}

let CIERRE_MES=Math.max(0,MES_ACTUAL-1);
function setCierreMes(v){CIERRE_MES=+v;render();}
function monthTot(f,tipo,m){const ar=leafAreasOf(f,tipo);let r=0,b=0,hasR=false;ar.forEach(a=>{const c=C(a.id);b+=c.budget[m]||0;if(c.real[m]!=null){r+=c.real[m];hasR=true;}});return {r:r,b:b,hasR:hasR};}
function ytdTot(f,tipo,m){let r=0,b=0;for(let k=0;k<=m;k++){const t=monthTot(f,tipo,k);r+=t.r;b+=t.b;}return {r:r,b:b};}
function viewCierre(){const f=curFaena();const m=Math.min(11,Math.max(0,CIERRE_MES));const fn=(DB.faenas.find(x=>x.id===f)||{}).name||'';
  const tot=monthTot(f,null,m),ytd=ytdTot(f,null,m),mina=monthTot(f,'mina',m),planta=monthTot(f,'planta',m);
  const ejec=tot.b?tot.r/tot.b*100:0;const devM=tot.b?(tot.r-tot.b)/tot.b:0;const devY=ytd.b?(ytd.r-ytd.b)/ytd.b:0;
  const sb=[],sr=[];let ab=0,arr=0;for(let k=0;k<=m;k++){const t=monthTot(f,null,k);ab+=t.b;arr+=t.r;sb.push(ab);sr.push(arr);}const labels=MESES.slice(0,m+1);

  areas.sort((x,y)=>y.dv-x.dv);

    const bg=cls==='bad'?'rgba(231,76,60,.14)':cls==='warn'?'rgba(232,181,60,.16)':'rgba(46,204,113,.14)';const fg=cls==='bad'?'#c0392b':cls==='warn'?'#b8860b':'#1e8e54';
    return '<div class="lrow"><div class="ic" style="background:'+bg+';color:'+fg+'">'+ic(a.tipo==='mina'?'mina':'planta',18)+'</div><div class="mid"><b>'+a.n+'</b><span>Real '+fmtK(a.r)+' · Budget '+fmtK(a.b)+'</span></div><div class="end"><span class="tag '+cls+'">'+(a.r==null?'—':(a.dv>0?'+':'')+(a.dv*100).toFixed(0)+'%')+'</span><div class="muted" style="font-size:10px;margin-top:3px">'+lab+'</div></div></div>';}).join('');
  const over=areas.filter(a=>a.r!=null&&a.dv>0.05).slice(0,3);
  let hall='<li>Ejecución del mes: <b>'+ejec.toFixed(0)+'%</b> del budget ('+fmtK(tot.r)+' de '+fmtK(tot.b)+').</li>';
  hall+='<li>Desviación acumulada (YTD): <b style="color:'+(devY>0?'#c0392b':'#1e8e54')+'">'+(devY>0?'+':'')+(devY*100).toFixed(1)+'%</b> ('+fmtM(ytd.r)+' real vs '+fmtM(ytd.b)+' budget).</li>';
  if(over.length)hall+='<li>Áreas sobre presupuesto: '+over.map(o=>'<b>'+o.n+'</b> ('+(o.dv*100).toFixed(0)+'%)').join(', ')+'.</li>';
  hall+='<li>Gasto del mes — Mina <b>'+fmtK(mina.r)+'</b> · Planta <b>'+fmtK(planta.r)+'</b>.</li>';
  const opts=MESES.map((mm,i)=>'<option value="'+i+'" '+(i===m?'selected':'')+'>'+mm+' '+ANIO+'</option>').join('');
  const devCol=devM>0?'#c0392b':'#1e8e54';
  function kpiArea(t,lbl,ico){const d=t.b?(t.r-t.b)/t.b:0;return '<div class="card kpi accent"><div class="lbl">'+ic(ico,14)+' '+lbl+'</div><div class="val">'+fmtM(t.r)+'</div><span class="delta '+(d>0?'up':'down')+'">'+(d>0?'+':'')+(d*100).toFixed(1)+'% vs budget</span></div>';}

function offerDownload(blob,fname,label){

  var ov=document.createElement('div');ov.id='dlOverlay';

    '<a href="'+url+'" download="'+fname+'" onclick="setTimeout(closeDownload,400)" style="display:block;background:linear-gradient(135deg,#123a68,#0c2140);color:#fff;text-decoration:none;font-weight:800;padding:13px;border-radius:12px;font-size:14px">'+'⬇  Descargar ahora</a>'+
    '<button onclick="closeDownload()" style="margin-top:10px;background:transparent;border:0;color:#8798ac;font-weight:700;cursor:pointer;font-size:12.5px">Cerrar</button>'+
    '</div>';
  ov.addEventListener('click',function(e){if(e.target===ov)closeDownload();});

   '<div class="statwrap"><div class="ministat"><div class="l">Real acumulado</div><div class="v">'+fmtM(tot.rAcum)+'</div></div><div class="ministat"><div class="l">Budget anual</div><div class="v">'+fmtM(tot.bAnual)+'</div></div><div class="ministat"><div class="l">Cierre proyectado</div><div class="v">'+fmtM(tot.proy)+'</div></div><div class="ministat"><div class="l">Desv. proyectada</div><div class="v" style="color:'+(dev>0?'#c0392b':'#1e8e54')+'">'+(dev>0?'+':'')+(dev*100).toFixed(1)+'%</div></div></div>'+
   '<div class="sectit"><span class="lft">Trayectoria anual · Budget vs Real + Proyección</span><span class="pill">US$K acumulado</span></div><div class="chartbox">'+lineChart(lab,bud,real,'Budget acum.','Real + Proyección')+'</div>'+
   '<div class="sectit"><span class="lft">Proyección por área · cierre vs budget</span><span class="pill">'+ars.length+' áreas</span></div><div class="card">'+(rows||'<div class="empty">Sin áreas</div>')+'</div>'+
   '<div class="sectit"><span class="lft">Detalle mensual · Real vs Budget</span><span class="pill">desv mes y acumulada</span></div><div class="card nopad" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Mes</th><th>Budget</th><th>Real</th><th>Desv mes</th><th>Acum. Real</th><th>Desv acum</th></tr></thead><tbody>'+(function(){var out="";for(var m=0;m<12;m++){var bm=s.b[m]||0;var rm=(m<=MES_ACTUAL)?(s.r[m]||0):(real[m]-(m>0?real[m-1]:0));var proj=m>MES_ACTUAL;var dm=bm?(rm-bm)/bm:0;var dacc=bud[m]?(real[m]-bud[m])/bud[m]:0;out+="<tr><td>"+MESES[m]+(proj?" <span class=\"muted\">(proy)</span>":"")+"</td><td>"+fmtK(bm)+"</td><td>"+fmtK(rm)+"</td><td class=\""+(dm>0?"neg":"pos")+"\">"+(dm>0?"+":"")+(dm*100).toFixed(0)+"%</td><td>"+fmtK(real[m])+"</td><td class=\""+(dacc>0?"neg":"pos")+"\">"+(dacc>0?"+":"")+(dacc*100).toFixed(0)+"%</td></tr>";}return out;})()+'</tbody></table></div>'+

function reportViz(r){var cols=r.cols||[];var rows=(r.rows||[]).filter(function(x){return !/total/i.test(''+((x&&x[0])||''));});if(!rows.length)return '';
  var numIdx=cols.map(function(c,i){return i;}).filter(function(i){return i>0&&rows.some(function(x){return x[i]!==''&&x[i]!=null&&!isNaN(parseFloat(x[i]));});});if(!numIdx.length)return '';
  var mi=numIdx[0];var max=Math.max.apply(null,[1].concat(rows.map(function(x){return Math.abs(parseFloat(x[mi])||0);})));
  var totals=numIdx.map(function(i){return rows.reduce(function(s,x){return s+(parseFloat(x[i])||0);},0);});
  var stats='<div class="statwrap">'+numIdx.map(function(i,k){return '<div class="ministat"><div class="l">'+cols[i]+'</div><div class="v">'+totals[k].toLocaleString('es-CL',{maximumFractionDigits:1})+'</div></div>';}).join('')+'</div>';
  var bars=rows.map(function(x){var v=parseFloat(x[mi])||0;return '<div class="barrow"><div class="top"><b>'+(x[0]==null?'':x[0])+'</b><span class="n">'+v.toLocaleString('es-CL',{maximumFractionDigits:1})+'</span></div><div class="track"><div class="fill '+(v<0?'ok':'')+'" style="width:'+Math.min(100,Math.abs(v)/max*100)+'%"></div></div></div>';}).join('');
  return '<div class="sectit"><span class="lft">Resumen · '+cols[mi]+'</span></div>'+stats+'<div class="card">'+bars+'</div>';}

  var drows=rows.filter(function(x){return !/total/i.test(''+((x&&x[0])||''));});
  var numIdx=cols.map(function(c,i){return i;}).filter(function(i){return i>0&&drows.some(function(x){return x[i]!==''&&x[i]!=null&&!isNaN(parseFloat(x[i]));});});

  var biIdx=cols.findIndex(function(c){return /budget|presup/i.test(c);});var riIdx=cols.findIndex(function(c){return /real|ejec/i.test(c);});
  var chartHtml='';

    chartHtml='<div class="sectit"><span class="lft">Budget vs Real por '+(cols[0]||'área')+'</span></div><div class="chartbox">'+barChart(labels,bud,rea)+'</div>';}
  else if(numIdx.length&&drows.length){var mi=numIdx[0];var mx=Math.max.apply(null,[1].concat(drows.map(function(x){return Math.abs(parseFloat(x[mi])||0);})));
    var bars=drows.map(function(x){var v=parseFloat(x[mi])||0;return '<div class="barrow"><div class="top"><b>'+(x[0]==null?'':x[0])+'</b><span class="n">'+v.toLocaleString('es-CL',{maximumFractionDigits:1})+'</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,Math.abs(v)/mx*100)+'%"></div></div></div>';}).join('');
    chartHtml='<div class="sectit"><span class="lft">'+cols[mi]+' por '+(cols[0]||'fila')+'</span></div><div class="card">'+bars+'</div>';}
  var tableHtml='';
  if(rows.length){var head='<tr>'+cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';var body=rows.map(function(row){return '<tr>'+cols.map(function(c,i){return '<td>'+(row[i]==null?'':row[i])+'</td>';}).join('')+'</tr>';}).join('');
    tableHtml='<div class="sectit"><span class="lft">Detalle completo</span><span class="pill">'+rows.length+' filas</span></div><div class="card nopad" style="overflow-x:auto"><table class="tbl">'+head+body+'</table></div>';}

  modalWide('<div class="crumb">'+ic('informes',13)+' '+t.name+'</div><h2 class="title" style="margin-top:2px">'+r.name+'</h2><div class="muted" style="margin-bottom:14px">'+r.area+' · '+(r.fecha||'')+'</div>'+

function feedReportFile(id,file){var r=DB.reports.find(function(x){return x.id===id;});if(!r||!file)return;var reader=new FileReader();

    r.cols=d[0].map(function(c){return (''+(c==null?'':c)).trim()||'Columna';});r.rows=d.slice(1).filter(function(row){return row&&row.some(function(c){return c!==''&&c!=null;});});
    await rest('mantos_reports?id=eq.'+id,'PATCH',{cols:r.cols,rows:r.rows});render();toast('Planilla cargada: '+r.rows.length+' filas');
  }catch(err){console.error(err);toast('Error: '+err.message);}};reader.readAsArrayBuffer(file);}

function tplCfg(){return (DB.settings&&DB.settings.tplConfig)||{scope:'all',name:'',cols:['Area','Mes','Budget','Real']};}
function genTemplate(cfg){const f=curFaena();const cols=(cfg.cols&&cfg.cols.length)?cfg.cols.slice():['Area','Mes','Budget','Real'];
  let ars=leafAreasOf(f);if(cfg.scope==='mina')ars=ars.filter(a=>a.tipo==='mina');if(cfg.scope==='planta')ars=ars.filter(a=>a.tipo==='planta');
  const isA=c=>/^(area|área)$/i.test(c),isM=c=>/^mes$/i.test(c),isB=c=>/^budget$/i.test(c),isR=c=>/^real$/i.test(c);
  const hasA=cols.some(isA),hasM=cols.some(isM);
  function cell(col,a,m){if(isA(col))return a?a.name:'';if(isM(col))return m!=null?MESES[m]:'';if(isB(col))return (a&&DB.costs[a.id])?DB.costs[a.id].budget[m]:'';if(isR(col))return (a&&DB.costs[a.id]&&DB.costs[a.id].real[m]!=null)?DB.costs[a.id].real[m]:'';return '';}
  const data=[cols];
  if(hasA&&hasM){ars.forEach(a=>{for(let m=0;m<=MES_ACTUAL;m++)data.push(cols.map(c=>cell(c,a,m)));});}
  else if(hasA){ars.forEach(a=>data.push(cols.map(c=>cell(c,a,null))));}
  else{const n=Math.max(12,cfg.rows||15);for(let i=0;i<n;i++)data.push(cols.map(()=>''));}
  const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,(cfg.sheet||'Planilla'));
  var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});offerDownload(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'Modelo_'+(cfg.name?cfg.name.replace(/[^a-z0-9]+/gi,'_'):f)+'.xlsx','plantilla Excel');}

  const nc=$('#tp_newcol');if(nc)nc.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addTplCol();}});}
function detectAreaCols(head){
  // Columna Área explícita (Chancado, Sulfuro, Óxido…)
  let areaC=head.findIndex(h=>h==='área'||h==='area'||h.indexOf('área dos')>=0||/^(área|area)\b/.test(h));
  // Nombre de CECO (Centro de coste2 / Nombre Ceco) como respaldo cuando Área viene vacía (típico en Mina)
  let cecoC=head.findIndex(h=>/coste\s*2|coste2/.test(h)||h.indexOf('nombre ceco')>=0||h.indexOf('centro de coste2')>=0);
  if(cecoC<0)cecoC=head.findIndex(h=>h.indexOf('centro de coste')>=0&&h.indexOf('cuenta')<0);
  if(areaC<0)areaC=findCol(head,['área','area']);
  return {areaC,cecoC};}
let IMPORT=null;
function parseWorkbook(rows){
  let hr=0;for(let k=0;k<Math.min(10,rows.length);k++){const hh=(rows[k]||[]).map(x=>(''+x).toLowerCase());if(findCol(hh,COLSYN.mes)>=0&&(findCol(hh,COLSYN.real)>=0||findCol(hh,COLSYN.bud)>=0)){hr=k;break;}}
  const head=(rows[hr]||[]).map(h=>(''+h).toLowerCase().trim());const rawHead=(rows[hr]||[]).map(h=>(''+h).trim());
  const mesC=findCol(head,COLSYN.mes),realC=findCol(head,COLSYN.real),budC=findCol(head,COLSYN.bud);
  const ac=detectAreaCols(head),areaC=ac.areaC;
  // Columna Ceco (código) — la llave para enganchar con el árbol sin aplanarlo
  let cecoKeyC=head.findIndex(h=>h==='ceco'||/\bceco\b/.test(h));
  if(cecoKeyC<0)cecoKeyC=ac.cecoC;
  // Columna con el nombre del equipo/área ("Centro de costo")
  let nameC=head.findIndex(h=>h.indexOf('centro de costo')>=0);
  if(nameC<0)nameC=areaC;
  const byCeco=cecoKeyC>=0;
  const col=i=>(i>=0&&rawHead[i]?rawHead[i]:'—');
  if(mesC<0||(!byCeco&&nameC<0&&areaC<0))return {ok:false,reason:'No encontré columnas de <b>Mes</b> y <b>Ceco/Centro de costo</b>. Revisa que la planilla tenga encabezados.'};
  if(realC<0&&budC<0)return {ok:false,reason:'No encontré columnas de <b>Real</b> ni <b>Budget/OL</b>.'};
  const agg={};let maxv=0,nrows=0;
  for(let i=hr+1;i<rows.length;i++){const row=rows[i];if(!row)continue;const m=monthIndex(row[mesC]);if(m<0)continue;
    var ceco=(cecoKeyC>=0&&row[cecoKeyC]!=null)?(''+row[cecoKeyC]).trim():'';
    var name=(nameC>=0&&row[nameC]!=null)?(''+row[nameC]).trim():'';
    if(!name&&areaC>=0&&row[areaC]!=null)name=(''+row[areaC]).trim();
    var key=(byCeco&&ceco)?ceco.toUpperCase():(name||ceco||'Sin área');
    if(/^total|etiquetas|suma de|general/i.test(name)||/^total/i.test(key))continue;
    if(!agg[key])agg[key]={name:(name||ceco),ceco:ceco,b:Array(12).fill(0),r:Array(12).fill(0),hb:Array(12).fill(false),hr:Array(12).fill(false)};
    if(!agg[key].name&&name)agg[key].name=name;if(!agg[key].ceco&&ceco)agg[key].ceco=ceco;
    if(budC>=0){const bv=parseNum(row[budC]);if(bv!=null){agg[key].b[m]+=bv;agg[key].hb[m]=true;maxv=Math.max(maxv,Math.abs(bv));}}
    if(realC>=0){const rv=parseNum(row[realC]);if(rv!=null){agg[key].r[m]+=rv;agg[key].hr[m]=true;maxv=Math.max(maxv,Math.abs(rv));}}
    nrows++;}
  const factor=maxv>=100000?0.001:1;const names=Object.keys(agg);let cells=0;
  names.forEach(g=>{for(let m=0;m<12;m++)if(agg[g].hb[m]||agg[g].hr[m])cells++;});
  const sample=names.map(g=>{let y=0;for(let m=0;m<12;m++)if(agg[g].hr[m])y+=agg[g].r[m];return {n:agg[g].name||g,ytd:y*factor};}).sort((x,y)=>y.ytd-x.ytd).slice(0,6);
  return {ok:true,agg,byCeco,factor,unidad:factor===1?'kUSD':'USD → kUSD',nrows,nAreas:names.length,nCells:cells,sample,
    cols:{mes:col(mesC),area:col(byCeco?cecoKeyC:(nameC>=0?nameC:areaC)),real:col(realC),bud:col(budC)},realC,budC};
}
function onImportFile(inp){const f=inp.files[0];if(f)readImportFile(f);}
function onImportDrop(e){const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readImportFile(f);}
function readImportFile(file){const r=new FileReader();r.onload=function(e){try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});IMPORT={name:file.name,parsed:parseWorkbook(rows)};renderImportPreview();}catch(err){toast('Error al leer: '+err.message);}};r.readAsArrayBuffer(file);}
function renderImportPreview(){const el=$('#importPreview');if(!el)return;if(!IMPORT){el.innerHTML='';return;}const p=IMPORT.parsed;
  if(!p.ok){el.innerHTML='<div class="banner" style="border-color:rgba(231,76,60,.35);background:rgba(231,76,60,.06);margin-top:12px">'+ic('doc',18)+'<div>'+p.reason+'</div></div>';return;}
  var tl=($('#xls_tipo')&&$('#xls_tipo').value==='planta')?'Planta':'Mina';
  const mc=(k,v,miss)=>'<div class="mapcell'+(miss?' miss':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  const samp=p.sample.map(s=>'<div class="barrow"><div class="top"><b>'+s.n+'</b><span class="n">'+fmtK(s.ytd)+'</span></div></div>').join('');
  el.innerHTML='<div class="card" style="margin-top:14px"><span class="pill-ok">'+ic('check',14)+' '+IMPORT.name+' · '+p.nrows+' filas leídas</span>'+
    '<div class="mapgrid">'+mc('Mes',p.cols.mes,false)+mc('Área / CECO',p.cols.area,false)+mc('Real',p.cols.real,p.realC<0)+mc('Budget / OL',p.cols.bud,p.budC<0)+'</div>'+
    '<div class="statwrap" style="margin:4px 0 6px"><div class="ministat"><div class="l">Áreas detectadas</div><div class="v">'+p.nAreas+'</div></div><div class="ministat"><div class="l">Celdas de costo</div><div class="v">'+p.nCells+'</div></div><div class="ministat"><div class="l">Unidad</div><div class="v" style="font-size:15px">'+p.unidad+'</div></div></div>'+
    '<div class="sectit"><span class="lft">Vista previa · top áreas (YTD Real)</span></div><div class="card" style="background:#fff">'+(samp||'<div class="empty">Sin datos numéricos</div>')+'</div>'+
    '<div class="banner" style="border-color:rgba(46,163,106,.4);background:rgba(46,163,106,.08);margin-top:10px">'+ic('shield',18)+'<div>Al confirmar, las cifras se <b>enganchan por Ceco</b> a cada equipo/área. El <b>organigrama se mantiene intacto</b> — solo se actualizan los números (los anteriores se reemplazan, no se suman).</div></div>'+
    '<div class="flexbtns" style="margin-top:12px"><button class="btn" style="width:auto" onclick="confirmImport()">'+ic('check',16)+' Confirmar y cargar '+tl+'</button><button class="btn ghost" style="width:auto" onclick="IMPORT=null;renderImportPreview()">Cancelar</button></div></div>';
}
function isLeafArea(a){return !DB.areas.some(function(x){return x.parent===a.id;});}
async function confirmImport(){if(!IMPORT||!IMPORT.parsed.ok)return;const p=IMPORT.parsed;const f=curFaena();const tipo=($('#xls_tipo')&&$('#xls_tipo').value)||'mina';const tl=(tipo==='mina'?'Mina':'Planta');
  toast('Cargando datos de '+tl+'…');
  /* 1) poner en CERO solo las HOJAS de este mundo — mantiene el árbol intacto */
  var leavesT=DB.areas.filter(function(a){return a.faena===f&&a.tipo===tipo&&isLeafArea(a);});
  leavesT.forEach(function(a){DB.costs[a.id]={budget:Array(12).fill(0),real:Array(12).fill(null)};});
  /* 2) mapa de hojas por Ceco y por nombre — robusto aunque la planilla invierta columnas */
  function nC(s){return (''+s).toUpperCase().replace(/\s+/g,'').trim();}
  function nN(s){return (''+s).toLowerCase().replace(/\s+/g,' ').trim();}
  var mapCeco={},mapName={};
  leavesT.forEach(function(a){if(a.ceco)mapCeco[nC(a.ceco)]=a;if(a.name)mapName[nN(a.name)]=a;});
  var hasTree=leavesT.length>0;let matched=0,createdN=0;var noMatch=[];
  for(const key of Object.keys(p.agg)){var G=p.agg[key];var target=null;
    var cands=[];if(G.ceco)cands.push(G.ceco);if(G.name)cands.push(G.name);
    for(var ci=0;ci<cands.length&&!target;ci++){target=mapCeco[nC(cands[ci])]||mapName[nN(cands[ci])];}
    if(!target){
      if(hasTree){noMatch.push(G.name||G.ceco||key);continue;}/* con árbol existente: NUNCA crear cabezas nuevas */
      var id=uid('n');target={id:id,faena:f,tipo:tipo,name:(G.name||G.ceco||'Sin asignar'),parent:null,nivel:0,orden:99,ceco:(G.ceco||null)};DB.areas.push(target);DB.costs[id]={budget:Array(12).fill(0),real:Array(12).fill(null)};try{await rest('mantos_areas','POST',target);}catch(e){}createdN++;
    }
    matched++;
    var c=DB.costs[target.id]||(DB.costs[target.id]={budget:Array(12).fill(0),real:Array(12).fill(null)});
    for(let m=0;m<12;m++){if(G.hb[m])c.budget[m]=G.b[m]*p.factor;if(G.hr[m])c.real[m]=G.r[m]*p.factor;}}
  /* 3) guardar en la nube TODAS las celdas de las hojas (refleja cero + lo nuevo, sin sumar lo viejo) */
  const ups=[];var allLeaves=DB.areas.filter(function(a){return a.faena===f&&a.tipo===tipo&&isLeafArea(a);});
  allLeaves.forEach(function(a){var c=DB.costs[a.id]||{budget:Array(12).fill(0),real:Array(12).fill(null)};for(let m=0;m<12;m++)ups.push({area_id:a.id,month:m,budget:c.budget[m]||0,real:(c.real[m]==null?null:c.real[m])});});
  try{if(ups.length)await rest('mantos_costs','POST',ups,'resolution=merge-duplicates');IMPORT=null;buildNav();render();
    toast(tl+' cargado: '+matched+' equipos/áreas'+(noMatch.length?(' · '+noMatch.length+' omitidos (Ceco no existe)'):'')+(createdN?' · '+createdN+' nuevos':''));
    if(noMatch.length)setTimeout(function(){alert('⚠️ '+noMatch.length+' fila(s) no coincidieron con ningún Ceco/equipo del organigrama y se OMITIERON (no se crearon cabezas nuevas):\n\n'+noMatch.slice(0,25).join('\n')+'\n\nRevisa que el Ceco de esas filas exista en el árbol.');},350);
  }catch(e){toast('Error: '+e.message);}}
function cfgSubir(){const f=curFaena();const ars=leafAreasOf(f);const opts=ars.map(a=>{var anc=ancestors(a).map(function(x){return x.name;}).reverse();return '<option value="'+a.id+'">'+(anc.length?anc.join(' › ')+' › ':'')+a.name+' ('+(a.tipo==='mina'?'Mina':'Planta')+')</option>';}).join('');
  return '<p class="muted" style="line-height:1.6">Elige el área (existente o nueva), sube tu informe Excel y la plataforma lo convierte en dashboard asociado a esa área, en la nube.</p>'+
   '<div class="card"><div class="sectit" style="margin-top:0"><span class="lft">'+ic('upload',16)+' Subir informe a un área</span></div>'+
   '<div class="field"><label>Área destino</label><select id="su_area" onchange="suToggle()">'+opts+'<option value="__new">+ Crear nueva área…</option></select></div>'+
   '<div id="su_newwrap" class="row2" style="display:none"><div class="field"><label>Nombre de la nueva área</label><input id="su_newname" placeholder="Ej: Espesadores"></div><div class="field"><label>Tipo</label><select id="su_newtipo"><option value="mina">Mina</option><option value="planta">Planta</option></select></div></div>'+
   '<div class="banner">'+ic('doc',18)+'<div>Flexible: reconoce <b style="color:var(--copper2)">Mes</b> (Ene, Enero, 1, 01 o fecha), y montos como <b style="color:var(--copper2)">Budget</b> (presupuesto, ppto, plan) y <b style="color:var(--copper2)">Real</b> (ejecutado, gasto, actual), con $ o separadores de miles. No necesita columna Área: tú la eliges arriba.</div></div>'+
   '<input type="file" id="su_file" accept=".xlsx,.xls,.csv" style="margin:8px 0">'+
   '<button class="btn" style="width:auto" onclick="importToArea(\''+f+'\')">'+ic('upload',16)+' Subir y generar dashboard</button></div>';}
function suToggle(){const v=$('#su_area').value;$('#su_newwrap').style.display=(v==='__new')?'grid':'none';}
function importToArea(f){const file=$('#su_file').files[0];if(!file)return toast('Selecciona un archivo');let areaId=$('#su_area').value;let cName='',cTipo='mina';
  if(areaId==='__new'){cName=$('#su_newname').value.trim();if(!cName)return toast('Escribe el nombre de la nueva área');cTipo=$('#su_newtipo').value;}
  const reader=new FileReader();
  reader.onload=async function(e){try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    if(!rows.length)return toast('Planilla vacía');
    let hr=0;for(let k=0;k<Math.min(8,rows.length);k++){const hh=(rows[k]||[]).map(x=>(''+x).toLowerCase());if(findCol(hh,COLSYN.mes)>=0){hr=k;break;}}
    const head=(rows[hr]||[]).map(h=>(''+h).toLowerCase().trim());
    const mi=findCol(head,COLSYN.mes);const bi=findCol(head,COLSYN.bud);const ri=findCol(head,COLSYN.real);
    if(mi<0)return toast('No encuentro la columna Mes. Revisa los encabezados.');
    if(areaId==='__new'){areaId=uid('a');DB.areas.push({id:areaId,faena:f,tipo:cTipo,name:cName});DB.costs[areaId]={budget:Array(12).fill(0),real:Array(12).fill(null)};await rest('mantos_areas','POST',{id:areaId,faena:f,tipo:cTipo,name:cName});}
    const c=DB.costs[areaId];const ups=[];let n=0;
    for(let i=hr+1;i<rows.length;i++){const row=rows[i];if(!row)continue;const m=monthIndex(row[mi]);if(m<0)continue;
      if(bi>=0){const bv=parseNum(row[bi]);if(bv!=null)c.budget[m]=bv;}
      if(ri>=0){const rv=parseNum(row[ri]);if(rv!=null)c.real[m]=rv;}ups.push({area_id:areaId,month:m,budget:c.budget[m],real:c.real[m]});n++;}
    if(ups.length)await rest('mantos_costs','POST',ups,'resolution=merge-duplicates');
    const area=DB.areas.find(a=>a.id===areaId);CURRENT=(area.tipo==='mina'?'equipmina':'areasrep');EDIT_AREA[area.tipo]=areaId;AREA_VIEW=areaId;ORG_EXP={};ancestors(area).forEach(function(n){ORG_EXP[n.id]=true;});buildNav();render();toast('Informe cargado a '+area.name+' · '+n+' meses');
  }catch(err){console.error(err);toast('Error: '+err.message);}};reader.readAsArrayBuffer(file);}
